<h3>1. Uygulama nasıl çalışır?</h3>
<p>Maaş modülünün <b>bütün formülleri uygulamanın içinde</b> çalışır. Yazdığın her bilgi <b>yalnızca telefonunda</b> saklanır, internet gerekmez. Üstteki yeşil rakam o ayın <b>net maaşıdır</b> ve sen yazdıkça anında değişir.</p>
<div class=gk><b>🎬 Tanıtım turu:</b> <b>☰ Menü → Tanıtım turu (sesli)</b> uygulamayı örnek verilerle, gölgeli vurgu ve sesli anlatımla gösterir. Kendi verilerine dokunmaz; istediğin an durdurabilir, geri/ileri alabilir veya sesi kapatabilirsin.</div>
<div class=gw><b>🔇 Tur sesi gelmiyorsa:</b> telefonda <b>Ayarlar › Metin okuma</b> bölümünde Türkçe sesin yüklü olduğundan emin ol. Uygulama sürümü eskiyse güncel APK’yı kur; yeni sürüm sesi telefonun kendi konuşma motoruyla çalar. Ses olmasa da altyazı akar, panelin başlığına dokunarak paneli küçültebilirsin.</div>
<div class=gn><b>💾 Otomatik kayıt:</b> Bilgi ve Veri Girişi’nde yazdığın her şey anında kaydedilir. Yazmayı bırakıp 2 saniye sonra, değiştirdiğin alanın hemen altında kısa bir <b>✓ Otomatik kaydedildi</b> etiketi görünür ve kaybolur. Maaş ayı ise <b>Maaşı hesapla ve kaydet</b> ile ayrıca kaydedilir.</div>
<div class=gn><b>💡 Renkler:</b> sarı kutular senin yazdığın bilgi, <b>gri kilitli</b> kutular otomatik hesaplanan değerdir ve elle değiştirilemez.</div>

<h3>2. İlk kurulum (bir kez)</h3>
<ol><li><b>☰ Menü → Profilim:</b> adını, teknik personelsen unvanını (Tekniker/Teknisyen), engel derecen varsa onu seç.</li><li><b>Bilgi ve Veri Girişi → Ücret ve zamlar:</b> TİS başlangıç yılını, başlangıç yevmiyesini ve zam oranlarını yaz.</li><li><b>Yan haklar:</b> sözleşmedeki başlangıç tutarlarını yaz.</li><li><b>Vergi:</b> brüt asgari ücreti, vergi dilimlerini ve engelli indirim tutarlarını yılbaşında güncelle.</li></ol>
<div class=gw><b>⚠️ Önemli:</b> “Güncel yevmiye” (yeşil kutu) bordronda yazan yevmiyeyle <b>aynı olmalı</b>. Farklıysa zam oranlarını ve başlangıç yevmiyesini kontrol et.</div>

<h3>3. Bilgi ve Veri Girişi — sekme sekme</h3>
<p><b>🔹 Ücret ve zamlar</b></p>
<ol><li><b>TİS başlangıç yılı:</b> sözleşmenin ilk yılını seç (örn. 2027 – 2028). Dönem adları (2027 1. DÖNEM…) buna göre <b>otomatik yazılır</b>, elle değiştirilemez.</li><li><b>TİS başlangıç yevmiyesi:</b> sözleşme başındaki günlük taban ücret. Zamlar bunun üzerine eklenir.</li><li><b>İyileştirme:</b> ilk dönemde günlük ücrete eklenen sabit tutar. Yoksa 0 bırak.</li><li><b>Dönem kutuları:</b> her dönemin <b>zam oranını</b> yaz. Yevmiye hemen altta otomatik çıkar. <b>Dönemler sırayla girilir</b>; önceki dönemin oranı yazılmadan sonrakine geçilmez.</li><li><b>Yeşil kutu = güncel yevmiye.</b> Zam oranı girilen son dönem güncel sayılır. Maaş hesabı bu tutarı kullanır.</li><li><b>Önceki dönem yevmiyesi:</b> güncel yevmiyeden bir önceki dönemin tutarıdır, kendiliğinden bulunur. Yalnızca ilk dönem güncelse TİS öncesi son yevmiyeni sen yaz. 14 günlük fark bu tutarı kullanır.</li><li><b>Sözleşmeye bağlı notlar:</b> iyileştirme ve işe giriş yevmiyesi açıklama metinleri; sözleşme değişince kendin düzenlersin.</li></ol>
<div class=gn><b>📌 İyileştirmeli / iyileştirmesiz:</b> iki yevmiye farklı çıkması için iyileştirme tutarı <b>0’dan büyük</b> olmalı. 0 ise ikisi aynıdır.</div>
<p><b>🔹 Yan haklar:</b> sosyal yardım, hizmet zammı, yemek, İSG, şoför, ek ödeme, giyim ve net yol. Başlangıç tutarını yaz; her dönem zammıyla güncel tutar kendiliğinden bulunur. <b>🔹 Vergi:</b> brüt asgari ücret, vergi dilimleri ve istisna anahtarı (açık kalsın). <b>🔹 Teknik fark:</b> yalnızca teknik personel için.</p>
<div class=gw><b>⚠️ Yıl uyuşmazlığı uyarısı:</b> Maaş yılı ile TİS yılı farklıysa (örn. maaş 2027, tablolar 2025–2026) sarı uyarı çıkar. <b>Yeni TİS imzalandıysa</b> <b>“TİS yılını … yap”</b> düğmesine bas ve <b>yeni tutarları yaz</b>. Yıl değişince yalnızca adlar değişir, tutarlar eski kalır. İmzalanmadıysa ve geriye dönük hesap bekliyorsan yılı değiştirme.</div>

<h3>4. Her ay maaş hesabı</h3>
<ol><li><b>Maaş Hesapla → ① Ay:</b> <b>çalıştığın ayı</b> seç. Maaşı bir sonraki ay alırsın: Şubat’ta alınan maaş Ocak maaşıdır, <b>Ocak</b> seçilir.</li><li><b>Çalışılan gün</b> ve <b>yemek günü</b>nü yaz.</li><li><b>Süregelen yıllık vergi matrahı:</b> bir önceki ay bordrosundaki toplam yıllık matrah. Ocak’ta 0’dır. Ayı kaydedip sonrakini seçince matrah <b>kendiliğinden taşınır</b>.</li><li><b>② Ek çalışma:</b> fazla mesai saatleri, resmi tatil günü, gece saatleri.</li><li><b>③ Diğer:</b> meslek tazminatı günleri, 14 günlük fark gibi o aya özel kalemler.</li><li><b>④ Tediye:</b> maaştan ayrı bir ödemedir; ödendiği ayda gün sayısını yaz.</li><li><b>⑤ Sonuç:</b> kazançlar, kesintiler ve net maaş. Bordronla karşılaştır, sonra <b>“Maaşı hesapla ve kaydet”</b> de.</li></ol>
<div class=gk><b>✅ Kaydedildi göstergesi:</b> kaydettiğin ayın seçicisi <b>yeşile döner</b>, listede <b>“✓ kaydedildi”</b> yazar ve altında yeşil not çıkar. Kayıt, yıllık takibe ve Bordro arşivine de işlenir.</div>
<div class=gw><b>⚠️ Dikkat:</b> bir ayı kaydetmeden sonraki aya geçersen vergi matrahı taşınmaz ve yıllık takip eksik kalır. Her ayı <b>kaydederek</b> ilerle.</div>

<h3>5. Maaşla otomatik gelen ödemeler</h3>
<table><tr><th>Ödeme</th><th>Maaşa eklendiği ay</th><th>Hesap</th></tr><tr><td>İkramiye</td><td>Mart ve Eylül (Şubat/Ağustos maaşı)</td><td>30 gün × günlük ücret</td></tr><tr><td>Ek ödeme</td><td>Mayıs (Nisan maaşı)</td><td>Bilgi › Yan haklar</td></tr><tr><td>Giyim yardımı</td><td>Eylül (Ağustos maaşı)</td><td>Bilgi › Yan haklar</td></tr><tr><td>Tediye</td><td>④ Tediye sekmesinde gün yazınca</td><td>gün × günlük ücret</td></tr></table>
<p>Bu ayda değilse tutar 0 ₺ görünür, bir şey yapman gerekmez.</p>

<h3>6. Vergi dilimi, yol ve vergi istisnası</h3>
<p>Gelir vergisi <b>dilim dilim</b> hesaplanır: matrah bir dilim sınırını aşarsa yalnızca aşan kısım üst oranla vergilenir (🟢%15 🟡%20 🟠%27 🔴%35). Yol yardımının brütü, ay sonunda bulunduğun dilime göre bulunur. Asgari ücret istisnası dilim yükseldikçe artar, fark net maaşa eklenir. <b>“Eksik/ilave vergi istisnası”</b> kutusu yalnızca yazdığın ay için geçerlidir.</p>

<h3>7. 14 Günlük Fark</h3>
<p>Zam, maaş döneminin ilk 14 gününü kapsıyorsa kullanılır (Ocak veya Temmuz maaşı).</p>
<ol><li><b>Güncel zam</b> düğmesine bas: <b>önceki dönem yevmiyesi</b> “Eski yevmiye”ye, <b>güncel yevmiye</b> “Yeni dönem yevmiyesi”ne yazılır.</li><li>Gerekirse “Daha önceki zamlar” altından eski bir zammı seç.</li><li>Diğer kalemleri kontrol edip <b>“Maaş hesabına aktar”</b> de.</li></ol>
<div class=gn><b>📌 Not:</b> 14 günlük fark, iki yevmiye arasındaki farkın 14 günlük karşılığıdır ve yalnızca <b>Ocak veya Temmuz</b> maaşına eklenir. Zam oranı girilmemiş dönemler listelenmez.</div>

<h3>8. Geriye Dönük Fark (TİS geç imzalanınca)</h3>
<p>Yeni TİS imzalanana kadar maaşların eski yevmiyeyle ödenir; imzadan sonra aradaki farkı hesaplarsın.</p>
<ol><li><b>İmzadan önce:</b> her ayın maaşını normal şekilde <b>kaydet</b>. Bu maaşlar “aldığım” kısmını otomatik doldurur (tek yıllarda: 2027, 2029…).</li><li><b>TİS imzalanınca → Geriye Dönük Fark → 📋 TİS GÜNCEL TUTARLAR:</b> her dönemin yeni tutarlarını yaz. Kırmızı atan <b>“Boş alanları güncel değerlerle doldur”</b> düğmesi önce mevcut tutarları yazar; sonra yeni TİS’e göre <b>düzelt</b>.</li><li><b>Hesapta kullanılacak yevmiye:</b> iyileştirmesiz veya iyileştirmeli seçeneğinden birini seç.</li><li><b>Aylık fark bordroları:</b> aylara sırayla gir. Açık olan ay turuncu, kaydedilenler yeşildir. “Aldığım” maaştan, “alacağım” TİS tutarlarından gelir.</li><li>Ayrıntıyı kontrol et, ayı <b>kaydet</b> ve sonrakine geç. Toplam sonuç <b>Genel tablo</b>dadır.</li><li>Bitince <b>“✅ Hesaplama tamam, toplam sonucu gör”</b> de; onaylarsan hesap <b>kapanır</b> ve sonraki maaşlar geriye dönüğe işlenmez.</li></ol>
<div class=gw><b>⚠️ Fark neden “—” görünüyor?</b> Alacağım (TİS) bilgileri tamamlanmadan ya da o ay için kayıtlı maaş yokken fark gösterilmez; yanlış (eksi) bakiye görünmesin diye. Ayın maaşını kaydet, TİS tutarlarını tamamla.</div>
<div class=gn><b>↩️ Yanlışlıkla kapattıysan:</b> Genel tablodaki <b>“Hesabı yeniden aç”</b> düğmesine bas. Kayıtlı aylar silinmez.</div>

<h3>9. Yeni zam veya yeni sözleşme gelince</h3>
<ol><li><b>Yeni dönem zammı:</b> Ücret ve zamlar’da o dönemin zam oranını yaz; yeni yevmiye otomatik bulunur.</li><li><b>Yeni sözleşme (iki yılda bir):</b> önce geriye dönük hesabı bitir. Sonra <b>TİS başlangıç yılını</b> seç, başlangıç yevmiyesini, zam oranlarını ve yan hak tutarlarını yeni sözleşmeye göre yaz.</li><li>İlk 6 ay yevmiyesi = başlangıç yevmiyesi × (1 + 1. dönem zammı). Kendiliğinden değişir.</li></ol>

<h3>10. Yıllık takip, bordro arşivi, grafik</h3>
<p>Kaydettiğin net maaşlar <b>Yıllık Ortalama Maaş ve Bordrolar</b> ekranında listelenir; geçmiş yılların ortalamaları ve <b>Bordro arşivi</b> orada durur. Ana ekrandaki grafik yalnızca <b>kaydedilmiş</b> ayları gösterir; kaydedilmemiş ay çubuğu boş kalır. Maaş ayı Ocak seçilince yeni yıl otomatik başlar.</p>

<h3>11. Yedek, geri yükleme, sıfırlama</h3>
<ol><li><b>☰ Menü → Verileri yedekle:</b> yedeği panoya kopyala ya da <b>PDF olarak paylaş</b>. Yedekte <b>her şey</b> vardır: profil, bütün tutarlar, kayıtlı aylar, bordrolar, TİS güncel tutarlar, geriye dönük hesap, görünüm ve şifre.</li><li><b>☰ Menü → Yedeği geri yükle:</b> yedek metnini yapıştır ya da PDF/dosyadan yükle. Geri yükleme her şeyi <b>aynen</b> getirir; önce özet gösterir, onayınla uygular. Dosya bozulmuşsa sağlama toplamı bunu yakalar.</li><li><b>☰ Menü → Verileri sıfırla:</b> her şeyi silip ilk kuruluma döner. Önce <b>yedek almanı</b> önerir; geri alınamaz.</li></ol>
<div class=gw><b>⚠️ Önemli:</b> Uygulamayı silmeden, telefonu değiştirmeden veya sıfırlamadan önce <b>mutlaka yedek al</b> ve yedeği güvenli bir yerde sakla (PDF’i kendine e-postayla gönderebilirsin). Yedek kişisel maaş bilgilerini içerir.</div>

<h3>12. Şifre, görünüm, güncelleme</h3>
<p><b>☰ Menü → Şifre:</b> uygulamaya şifre koyar (ekran kilididir, veriler şifrelenmez; şifre unutulursa kurtarılamaz, bu yüzden yedek al). <b>Görünüm:</b> otomatik, açık veya koyu tema. Yeni sürüm çıkınca üstte bildirim görünür; <b>Güncelle</b>’ye dokunman yeterlidir, veriler silinmez.</p>

<h3>13. Sık yapılan hatalar</h3>

<h3>Resmî belge değildir</h3><p>Asıl olan, çalıştığınız kurumun düzenlediği <b>maaş bordronuzdur</b>. Uygulamanın sonuçları ve oluşturduğu bordro örnekleri tahminidir; resmî bordro yerine geçmez, itiraz, hak talebi veya hukuki işlemlerde dayanak olarak kullanılamaz.</p>

<p><b>2. Aylık puantaj verileri.</b> İşçinin o ayki kişisel çalışması; çalışılan gün, fazla mesai, gece çalışması, resmî tatil ve arefe çalışması, izin ve benzeri puantaj bilgileri maaş hesaplama kalemlerine doğru girilmelidir. Aylık maaş, çalışma puantajına göre kişiden kişiye değişir. Bu veriler eksik veya hatalı girilirse sonuç da hatalı olur.</p>

function ensureUI(){try{const m=document.getElementById('m'),vis=[...document.querySelectorAll('.scr')].some(e=>!e.hidden);if(!m||!m.firstElementChild||!vis){build();route();fill()}}catch(e){fatal(e)}}
function fe(e){try{const t=((e&&e.message)||String(e))+' · v'+VER;window._fe=t;let b=document.getElementById('fe');if(!b){b=document.createElement('div');b.id='fe';b.className='fe';const m=document.getElementById('m');if(m)m.parentNode.insertBefore(b,m)}b.textContent='⚠️ Bir bölüm yüklenemedi: '+t}catch(_){}}
function fatal(e){const m=document.getElementById('m');if(m)m.innerHTML='<div class=card style="margin:14px"><h2>⚠️ Ekran açılamadı</h2><p class=sub>Bilgileriniz silinmedi. Yeniden yüklemeyi deneyin; olmazsa önbelleği temizleyin.</p><p class=sub style="font-size:12px;word-break:break-word">Hata: '+esc(((e&&e.message)||String(e))+' · v'+VER)+'</p><button class=b onclick="location.reload()">Yeniden yükle</button><button class="b s" onclick="hardRefresh()">Önbelleği temizle ve yenile</button></div>';try{if(!sessionStorage.getItem('maas_rec')){sessionStorage.setItem('maas_rec','1');setTimeout(hardRefresh,600)}}catch(_){}}
async function hardRefresh(){try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}location.reload()}
window.addEventListener('error',()=>setTimeout(ensureUI,200));
try{build();route();gate()}catch(e){fatal(e)}
setTimeout(ensureUI,1500);setTimeout(()=>{try{const m=document.getElementById('m');if(m&&!/Ekran açılamadı/.test(m.textContent))sessionStorage.removeItem('maas_rec')}catch(_){}},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(ensureUI,300)});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
