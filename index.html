@media(prefers-color-scheme:dark){:root{--bg:#10151b;--cd:#1a222b;--tx:#e6ecf2;--mu:#90a0b0;--pr:#5aa2e6;--ok:#4cc38a;--bd:#2c3744;--ac:#22303f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
header{background:var(--pr);color:#fff;padding:12px 16px;font-weight:700}

.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}

.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:11px;color:var(--mu)}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px;margin-top:2px}
.r{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.r b{font-variant-numeric:tabular-nums}.r.t{font-weight:700;border:0;background:var(--ac);padding:8px;border-radius:8px;margin-top:4px}
.big{font-size:22px;color:var(--ok);font-weight:800;text-align:center;padding:6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 2px;font-size:12px;font-weight:600}
nav button.on{color:var(--pr);border-top:3px solid var(--pr)}
.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:600;width:100%;margin-top:6px}
.b.s{background:var(--bd);color:var(--tx)}small{color:var(--mu);font-size:12px}
details summary{cursor:pointer;font-weight:600;color:var(--pr);padding:4px 0}
