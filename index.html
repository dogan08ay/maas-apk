:root{--bg2:#dfeaf6}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg2:#13263a}}:root[data-theme=dark]{--bg2:#13263a}
body{background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 320px) no-repeat,var(--bg)}
.top{background:linear-gradient(135deg,#0a335c,#1565a8);box-shadow:0 3px 12px #0b3a6655}
#sc-home .greet{font-size:19px;font-weight:800;letter-spacing:-.2px}
#sc-home .bigc{position:relative;overflow:hidden;background:radial-gradient(520px 200px at 88% -25%,#4fb3ff59,transparent 62%),linear-gradient(135deg,#082f55,#145f9f 62%,#2b8fd6);box-shadow:0 10px 26px #0b3a6666,inset 0 1px 0 #ffffff30}
#sc-home .bigc::after{content:"";position:absolute;right:-34px;bottom:-46px;width:160px;height:160px;border-radius:50%;background:#ffffff12;pointer-events:none}
#sc-home .tiles .tile{position:relative;overflow:hidden;padding-left:15px;border:1px solid color-mix(in srgb,var(--c,#6286b3) 38%,var(--bd));background:linear-gradient(155deg,var(--cd) 48%,color-mix(in srgb,var(--c,#6286b3) 12%,var(--cd)));box-shadow:0 3px 10px color-mix(in srgb,var(--c,#6286b3) 20%,transparent)}
#sc-home .tiles .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,#6286b3)}
#sc-home .tiles .tile .ic{background:linear-gradient(135deg,color-mix(in srgb,var(--c,#6286b3) 32%,#fff),color-mix(in srgb,var(--c,#6286b3) 13%,var(--cd)))!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#6286b3) 38%,transparent)}
#sc-home .cg2{border:1px solid var(--bd);border-left:5px solid var(--c,#6286b3);box-shadow:0 2px 8px color-mix(in srgb,var(--c,#6286b3) 14%,transparent)}
#sc-home .cg2 h2{font-size:15.5px}
#sc-home .cg2 .tg{color:var(--c,#6286b3);border-color:color-mix(in srgb,var(--c,#6286b3) 42%,var(--bd));background:color-mix(in srgb,var(--c,#6286b3) 10%,var(--cd))}
#sc-home .hvc{border-left:5px solid #e08a1a}
.dh{background:linear-gradient(135deg,#0a335c,#1565a8)!important;color:#fff!important;padding:calc(22px + env(safe-area-inset-top)) 20px 18px;font-size:17px}

.zgn.kb{margin:6px 0;padding:8px 10px;border-radius:10px;background:#e6f4ea;border:1.5px solid #5cb85c;font-size:13px;color:#0b2447}

/* Sözleşme Asistanı */
.asBd{background:#ffd54a;color:#4a3300;font-weight:800;font-size:11px;letter-spacing:.5px;padding:3px 9px;border-radius:20px}
#sc-asist .asHero{border-radius:20px;padding:16px 14px 14px;color:#fff;background:linear-gradient(135deg,#0b7a5a,#12a37f 58%,#1d8fd1);box-shadow:0 6px 18px #0b7a5a44;margin-bottom:12px;position:relative;overflow:hidden}
.asHero:before{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:#ffffff1c}
.asHt,.asHero h2,.asHero p,.asSearch,.asDl,.asDon{position:relative;z-index:1}
.asTg{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;background:#ffffff2e;border-radius:12px;padding:4px 10px}
.asHero h2{margin:10px 0 2px;font-size:22px;line-height:1.15;font-weight:800;color:#fff}
.asHero p{margin:0 0 12px;font-size:14.5px;opacity:.97}
.asSearch{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:0 10px 0 12px;box-shadow:0 2px 8px #0003}
.asSearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:16px system-ui,sans-serif;padding:13px 0;color:#14202e;-webkit-appearance:none;appearance:none;text-align:left}
.asSearch input::placeholder{color:#7b8a99}
.asSearch input::-webkit-search-cancel-button{display:none}
.asX{flex:none;border:0;background:#e9eef3;border-radius:50%;width:26px;height:26px;color:#456;font-size:13px}
.asDl{font-size:12px;opacity:.92;margin:12px 0 6px;font-weight:600}
.asDon{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.asDon button{border:1.5px solid #ffffff59;background:#ffffff1f;color:#fff;border-radius:12px;padding:8px 6px;font:700 13px/1.2 system-ui,sans-serif}
.asDon button small{display:block;font-weight:500;font-size:10.5px;opacity:.92;margin-top:2px}
.asDon button.on{background:#fff;color:#0b6a50;border-color:#fff}
.asH{margin:18px 2px 8px;font-size:16.5px;color:var(--tx);text-transform:none;letter-spacing:0}
.asH small{color:var(--mu);font-weight:500}
.asSub{margin:-4px 2px 10px;color:var(--mu);font-size:13px;line-height:1.35}
.asTiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.asTile{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:16px;background:var(--cd);padding:12px;font:inherit;color:var(--tx);box-shadow:0 2px 6px #0001}
.asTile:active{background:var(--ac)}
.asTile.w{grid-column:span 2;flex-direction:row;align-items:center;gap:12px}
.asTile .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--cb);flex:none}
.asTile b{font-size:15px;line-height:1.2}
.asTile small{color:var(--mu);font-size:12px}
.asTc{flex-direction:row;align-items:center;gap:10px;padding:10px 12px}
.asPop{display:flex;flex-direction:column;gap:6px}
.asPop button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--bd);border-radius:14px;background:var(--cd);padding:12px;font:600 15px/1.25 system-ui,sans-serif;color:var(--tx)}
.asPop button span{font-size:18px}.asPop button i{margin-left:auto;font-style:normal;color:var(--mu);font-size:20px}
.asPop button:active{background:var(--ac)}
.asChips{display:flex;flex-wrap:wrap;gap:6px}
.asChips button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:16px;padding:6px 12px;font:600 13px system-ui,sans-serif}
.asQ{background:var(--cd);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 4px #0001}
.asQh{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;font:inherit;color:var(--tx);padding:12px}
.asQh b{flex:1;font-size:15px;line-height:1.3;font-weight:700}
.asQh i{font-style:normal;color:var(--mu);transition:transform .2s;flex:none}
.asQ.on .asQh i{transform:rotate(180deg)}
.asQi{width:30px;height:30px;border-radius:10px;background:var(--cb);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.asA{padding:0 12px 12px}
.asAt{font-size:15px;line-height:1.5;margin-bottom:8px}

.asT{font-size:10.5px;color:var(--mu);font-weight:600;margin-left:3px}
.asPers{background:var(--ac);border:1px dashed var(--pr);border-radius:12px;padding:9px 11px;margin:8px 0;font-size:14px;line-height:1.4}
.asPers>span{display:block;font-size:11.5px;font-weight:800;color:var(--pr);margin-bottom:3px;letter-spacing:.3px}
.asMeta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.asMd{display:inline-flex;align-items:center;gap:4px;background:var(--ac);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:4px 10px;font-size:12.5px;font-weight:700}
.asMd0{color:var(--mu);font-weight:600}

const VER='10.9';const NOTES=["Yeni: Sağlık İşçisi Sözleşme Asistanı. Toplu iş sözleşmesindeki haklarını kendi cümlenle ara; her cevap ilgili TİS maddesi ve PDF sayfasıyla gelir","Sözleşme Asistanı: gece zammı, mesai, nöbet, izin, yardımlar ve disiplin cezaları; dönem seçimiyle tutarlar seçtiğin döneme göre görünür","Sözleşme Asistanı: gece çalışması, fazla mesai, icap, yemek, resmî tatil ve yıllık izin için hak hesaplayıcı; brüt ve güncel vergi dilimine göre net tutar, favoriler, paylaşma","Ana sayfa daha derli toplu: sözleşme asistanı kartı alt bölüme alındı, alt bilgi tek satıra sığdırıldı; mail adresinin satır taşması düzeltildi","Düzeltme: tanıtım turunda işe gelme günü örneği ve metni uyumlu hale getirildi; hizmet yılı ve yıllık izin anlatımı eklendi","Sözleşme Asistanı: hesap sonucunda net tutar üstte, altta brüt hesap detayı ayrı başlıkla; fazla mesaide yalnızca yazılan (gündüz veya gece) satır gösterilir; geri tuşu önce asistan ana ekranına döner. Şifre ekranının tuş takımı ekranın altına alındı (tek elle kullanım); resmî tatil ikonu yenilendi","Sözleşme Asistanı: her cevapta Hata bildir düğmesi, bilgi tarihi etiketi, aranan soru bulunamazsa Bize sor; cevaplar TİS PDF’ine göre yeniden doğrulandı ve 16 yeni soru eklendi","Hizmet primi sözleşmedeki %16 olarak otomatik geliyor (TİS güncel tutarlar sekmesinde elle yazmaya gerek yok); sözleşmede olmayan arefe çalışması kalemi kaldırıldı","Düzeltme: koyu temada Gizlilik politikası, Kullanım şartları ve Hakkında ekranlarındaki bağlantı ve notların okunmaması giderildi","Ana ekranın en altına iletişim ve geri bildirim satırı ile gizlilik politikası ve kullanım şartları bağlantıları eklendi","Yeni: Gizlilik politikası ve Kullanım şartları menüye ve ilk açılış ekranına eklendi (web sayfası bağlantılarıyla)","Puantaj kartı bölümlere ayrıldı: Çalışma günleri (işe gelme ve SGK günü), Aylık rutin kalemler (yemek, yol, gece, İSG, şoför, ambulans), Ek çalışmalar (mesai, resmi tatil, icap), Seçilen farklı ödemeler (TİS maddesiyle)","14 günlük farkta dönem yevmiyelerinin tarih aralıkları gösterilir; bordroda farklı ödemelerin TİS maddesi yazılır","Yeni: Sonuç adımında Resmî bordroyla karşılaştırma; bordrodaki net maaşı yazınca fark görünür","Yeni: Puantaj kartı ve arşivdeki puantajlar PDF olarak paylaşılabilir","Yeni: Yedek hatırlatması (hiç yedek yoksa ya da 30 günden eskiyse) ve maaş yaklaşırken puantajı onayla hatırlatması ana ekranda","Puantaj kartı yeniden tasarlandı: yalnızca maaşa etki eden aylık çalışma verileri, her bölümde Düzenle düğmesi; onay öncesi sorumluluk uyarısı çıkar","Puantaj arşivi artık bordro arşivi gibi yıl yıl ayrılır ve kart aynı görünümle açılır","Dönem kartlarında ‘tahmini yevmiye’ yerine ‘Açıklanan Enflasyona Göre Yevmiye’ başlığı","Uygulamayı paylaş kartının yazı düzeni düzeltildi","Ortalama maaş panelinde kayıt yoksa çizgi yerine 0,00 ₺ görünür; Hakkında ekranı artık güncel sürümü gösterir","Düzeltme: ilk açılışta (ve verileri sıfırlayınca) maaş ayı seçilmemiş gelir, ay seçilene kadar net maaş 0 görünür","Uygulamayı paylaş: görselli yeşil kart; WhatsApp, Telegram, Facebook, X, SMS, e-posta ile gönderme ve bağlantı kopyalama","Puantaj kartında yalnızca girilen kalemler görünür; İSG, şoför, tediye gibi kalemler girilince kartta belirir","Yeni: İlk açılışta maaş ayı seçilmemiş gelir; ay seçilene kadar net maaş 0 görünür, maaş ayı satırı yanıp söner ve sonraki adımlar açılmaz","Yol parası uyarısı: yol alanına gidince altta Maaş hesabına geri dön düğmesi çıkar","Yeni: Maaş Hesapla’ya ⑥ Puantaj adımı eklendi. Girdiğin bütün bilgiler tek kartta toplanır, anında güncellenir; onaylayınca Sonuç adımı açılır","Yeni: Onaylanan puantajlar Ortalama Maaş, Bordro ve Puantajlar ekranındaki Puantaj arşivi’nde saklanır; maaş hesaplanınca kayda Maaş hesaplandı ve net maaş işlenir","Yeni: Yol parası girilmemişse Devam derken uyarı çıkar ve Yan haklar’daki yol alanına tek dokunuşla gidilir","Bordro görünümü yeniden renklendirildi (içerik aynı)","Uygulamayı paylaş düğmesi menüde tek başına, öne çıkan bir yerde","Düzeltme: kayıt hatırlatması artık doğru adımı (⑦ Sonuç) söyler","Puantaj sayfası kaldırıldı; çalışma bilgileri yine Maaş Hesapla’da girilir","Kullanım kılavuzu, sorumluluk reddi beyanı ve kullanım şartları baştan yazıldı; yerleşim düzeltildi","Menüye Uygulamayı paylaş eklendi; kılavuz menüsü doğru sekmeyi açar","Yaklaşan ödemelerde giyim yardımı da görünür","Maaşı hesapla ve kaydet düğmesi Sonuç adımına taşındı","TİS imzalandıktan sonra kaydedilen maaşlar geriye dönük fark bordrosuna girmez (imza durumu admin veri paketinden gelir)","Geriye dönük: kayıtlı bordro olmayan aya kayıt yapılamaz, uyarı verilir","Ay geri alınınca o ayın girişleri bordrodan geri yüklenir ve o ayın kaydı silinmez","Geriye dönük yol parası artık net tutar olarak girilir ve her ayın vergi dilimine göre brüte çevrilir","14 günlük fark: yol farkı yönü düzeltildi, sendika farkı kesinti olarak işlenir","Geriye dönük: boş alanları doldur yalnızca tek sayılı yıl ve imzalanmış TİS verisi varsa çalışır, aksi halde ‘TİS imza bekleniyor’ yazar","2. dönemde iyileştirmeli/iyileştirmesiz seçimi kalktı","Excel kaynaklı hatalar giderildi: 2. ve 8. satırdaki 14 günlük formüller, bozuk matrah zinciri, toplu hesap yemek istisnası","Arefe ve Ramazan yemek kalemleri geriye dönükten kaldırıldı; yemek farkı ‘Yemek ücreti’ olarak hesaplanır","Geriye dönük gelir vergisi artık güncel vergi dilimi sınırları ve oranlarıyla hesaplanır (5. dilim dahil)","Ay değişince işe gelme, mesai, yemek ve tediye girişleri sıfırlanır","Geriye dönük ayrıntılarda fark satırları vurgulandı","Sorumluluk reddi beyanı ve kullanım şartları güncellendi (yeniden onay istenir)","Düzeltme: Aralık maaşı Ocak’ta ödendiği için yeni vergi yılını başlatır; süregelen matrah Aralık maaşında sıfırlanır, Ocak maaşına Aralık bordrosunun matrahı taşınır","Düzeltme: asgari ücret istisnası ve yıllık vergi verileri Aralık maaşında yeni yıla göre uygulanır","Düzeltme: Geriye dönük fark: hizmet primi oranı artık bordrodan al <h3>1. Uygulama nasıl çalışır?</h3>
<p>Bütün hesaplar uygulamanın içinde yapılır. Yazdığın her bilgi <b>yalnızca telefonunda</b> saklanır; hesaplamak için internet gerekmez. Üstteki yeşil rakam o ayın net maaşıdır ve bilgi girdikçe anında değişir.</p>
<ul><li><b>🎬 Tanıtım turu:</b> ☰ Menü → Tanıtım turu (sesli). Örnek verilerle anlatır, kendi verilerine dokunmaz.</li><li><b>🔇 Ses gelmiyorsa:</b> telefonda Ayarlar › Metin okuma’da Türkçe sesin yüklü olduğundan emin ol. Ses olmasa da altyazı akar.</li><li><b>💾 Otomatik kayıt:</b> Bilgi ve Veri Girişi’ndeki değişiklikler anında kaydedilir. Maaş ayı ise <b>Maaşı hesapla ve kaydet</b> ile kaydedilir.</li><li><b>💡 Renkler:</b> sarı kutular senin yazdığın bilgidir, gri kilitli kutular otomatik hesaplanır ve değiştirilemez.</li></ul>

<h3>2. İlk kurulum (bir kez)</h3>
<ol><li><b>☰ Menü → Profilim:</b> adını, işe giriş tarihini, teknik personelsen unvanını, engel derecen varsa onu ve hak ettiğin yardımları seç.</li><li><b>Bilgi ve Veri Girişi › Yan haklar:</b> yalnızca <b>günlük net yol ücretini</b> yaz (ile ve işyerine göre değişir). Yazmazsan Maaş Hesapla’da <b>Devam</b> derken uygulama uyarır ve seni bu alana götürür.</li></ol>
<div class=gw><b>⚠️ Önemli:</b> Bilgi ve Veri Girişi’ndeki “Güncel yevmiye” bordronda yazan yevmiyeyle <b>aynı olmalı</b>. Farklıysa işe giriş tarihini (Profilim) kontrol et ve uygulamayı güncelle.</div>

<h3>3. TİS ve yasal veriler kimde?</h3>
<p>TİS tutarları, zam oranları, vergi dilimleri, asgari ücret ve yan hak tutarlarını <b>uygulamanın geliştiricisi</b> günceller; yeni sürümle birlikte uygulamaya gelir. <b>Bilgi ve Veri Girişi</b> ekranındaki bu alanlar kilitlidir, yalnızca bordronla karşılaştırman içindir. Yeni TİS imzalandığında ve yeni zam gelince tek yapman gereken <b>uygulamayı güncel tutmaktır</b>.</p>
<ul><li><b>Ücret ve zamlar:</b> yevmiye, dönem zam oranları, yeni yevmiyeler.</li><li><b>Yan haklar:</b> sosyal yardım, hizmet zammı, yemek, İSG, şoför, ek ödeme, giyim. Yalnızca net yol sana aittir.</li><li><b>Farklı ödemeler:</b> o aya özel ödemeler (ölüm, doğum, evlenme, süt parası, icap, ek öğün vb.).</li><li><b>Vergi:</b> asgari ücret ve vergi dilimleri.</li><li><b>Teknik fark:</b> yalnızca teknik personel için.</li><li><b>TİS Arşivi:</b> imzalanan sözleşmelerin metinleri.</li></ul>

<h3>4. Maaş Hesapla: adım adım</h3>
<ol><li><b>Ay ve günler:</b> önce <b>maaş ayını seç</b> (seçilene kadar net maaş 0 görünür ve ay satırı yanıp söner), sonra işe gelme gün sayısını ve yemek gününü yaz. Çalışma bilgilerini eksiksiz girmek maaşın doğruluğu için şarttır. Maaşı bir sonraki ay alırsın: Ekim maaşı Kasım’da, Aralık maaşı Ocak’ta ödenir.</li><li><b>Ek çalışmalar:</b> fazla mesai, resmi tatil ve gece çalışması.</li><li><b>Diğer ödemeler:</b> meslek tazminatı günleri ve 14 günlük fark gibi o aya özel kalemler.</li><li><b>Farklı ödemeler:</b> o aya özel ödemeleri işaretle.</li><li><b>Tediye:</b> tediye ödenen ayda gün sayısını yaz.</li><li><b>Puantaj:</b> maaşa etki eden aylık çalışma verilerin (günler, mesai, tazminatlar, yol parası, ek ödemeler) tek kartta toplanır; her bölümdeki <b>Düzenle</b> seni ilgili adıma götürür ve sen değiştirdikçe anında güncellenir. Yalnızca girdiğin kalemler görünür (İSG, şoför, tediye vb. girilmediyse kartta yer almaz); bir kalemi girince kartta o anda belirir. Kontrol listesi tamamsa <b>Onaylıyorum, sonuca geç</b> de. <b>Onaylıyorum</b> dediğinde çıkan uyarıyı oku: puantaj verileri sana özeldir, maaşı doğrudan etkiler ve doğruluğu kullanıcıya aittir. Onaylanan puantaj <b>Ortalama Maaş, Bordro ve Puantajlar › Puantaj arşivi</b>’ne yıl yıl kaydedilir. Karttaki <b>PDF olarak paylaş</b> düğmesiyle puantajını gönderebilirsin; aynı düğme arşivdeki kayıtlarda da vardır. Maaş ayının son günlerine girince ana ekranda puantajı onaylaman için hatırlatma çıkar. Onaydan sonra bir bilgiyi değiştirirsen kart “Değişti, yeniden onayla” der ve Sonuç adımı yeniden onay ister.</li><li><b>Sonuç:</b> kazançlar, kesintiler ve net maaş. Bordronla karşılaştır, sonra <b>Maaşı hesapla ve kaydet</b> de. Maaş yalnızca bu düğmeyle hesaplanıp kaydedilir. Sonucun altındaki <b>Resmî bordroyla karşılaştır</b> kutusuna kurumunun verdiği bordrodaki net tutarı yazarsan uygulama farkı gösterir.</li></ol><div class=gw><b>🚌 Yol parası:</b> günlük net yol tutarı 0 ise <b>Devam</b> derken uyarı çıkar. <b>Yol parasını gir</b> dersen seni Yan haklar’daki yol alanına götürür; yazınca altta çıkan <b>Maaş hesabına geri dön</b> düğmesiyle kaldığın adıma dönersin. Değer bir kez yazılır, sonraki aylarda da kullanılır.</div>
<ul><li><b>Süregelen yıllık vergi matrahı:</b> bir önceki ayın toplam matrahıdır ve ay değişince kendiliğinden taşınır. Aralık maaşı Ocak’ta ödendiği için yeni vergi yılının ilk maaşıdır; matrah Aralık maaşında 0’dan başlar. Ocak maaşında Aralık bordrosunun toplam matrahı taşınır.</li><li><b>✅ Kaydedildi göstergesi:</b> kaydedilen ayın seçicisi yeşile döner. Kayıt, yıllık takibe ve bordro arşivine de işlenir.</li></ul>
<div class=gw><b>⚠️ Dikkat:</b> bir ayı kaydetmeden sonraki aya geçersen vergi matrahı taşınmaz ve yıllık takip eksik kalır. Her ayı <b>kaydederek</b> ilerle.</div>

<h3>5. Maaşla otomatik gelen ödemeler</h3>
<ul><li><b>İkramiye:</b> Mart ve Eylül’de ödenir (Şubat ve Ağustos maaşı). 30 gün × günlük ücret.</li><li><b>Ek ödeme:</b> Mayıs’ta ödenir (Nisan maaşı).</li><li><b>Giyim yardımı:</b> Eylül’de ödenir (Ağustos maaşı).</li><li><b>Tediye:</b> Tediye adımında gün yazınca hesaplanır.</li></ul>
<p>Bu ayda değilse tutar 0 ₺ görünür, bir şey yapman gerekmez. Ana ekrandaki <b>Yaklaşan ödemeler</b> bu ödemelerin ne zaman geleceğini gösterir.</p>

<h3>6. Vergi dilimi, yol ve vergi istisnası</h3>
<p>Gelir vergisi <b>dilim dilim</b> hesaplanır: matrah bir dilim sınırını aşarsa yalnızca aşan kısım üst oranla vergilenir. Yol yardımı net ödenir; brütü, ay sonunda bulunduğun vergi dilimine göre bulunur. Asgari ücret istisnası dilim yükseldikçe artar ve net maaşa yansır. <b>“Eksik/ilave vergi istisnası”</b> kutusu yalnızca yazdığın ay için geçerlidir.</p>

<h3>7. 14 Günlük Fark</h3>
<p>Zam, maaş döneminin ilk 14 gününü kapsıyorsa kullanılır (Ocak veya Temmuz maaşı).</p>
<ol><li><b>Güncel zam</b> düğmesine bas: önceki dönem yevmiyesi “Eski yevmiye”ye, güncel yevmiye “Yeni dönem yevmiyesi”ne yazılır.</li><li>Gerekirse “Daha önceki zamlar” altından eski bir zammı seç.</li><li>Diğer kalemleri kontrol edip <b>Maaş hesabına aktar</b> de.</li></ol>
<div class=gn><b>📌 Not:</b> Sonuç, iki yevmiye arasındaki farkın 14 günlük karşılığıdır ve yalnızca Ocak veya Temmuz maaşına eklenir. Sendika aidatı farkı kesinti olarak düşülür.</div>

<h3>8. Geriye Dönük Fark (TİS geç imzalanınca)</h3>
<p>TİS iki yılda bir, <b>tek sayılı yıllarda</b> (2025, 2027…) imzalanır. İmzaya kadar maaşların eski tutarlarla ödenir; imzadan sonra aradaki farkı bu bölümde hesaplarsın.</p>
<ol><li><b>İmzadan önce:</b> her ayın maaşını normal şekilde <b>kaydet</b>. Bu maaşlar “aldığım” kısmını otomatik doldurur.</li><li><b>İmzadan sonra:</b> TİS imzalandığında geliştirici yeni TİS verisini uygulamaya işler; <b>TİS GÜNCEL TUTARLAR</b> sekmesinde “TİS imzalandı” yazar. <b>Boş alanları doldur</b> düğmesi yeni tutarları getirir. İmza öncesinde “TİS imza bekleniyor” yazar ve düğme çalışmaz.</li><li><b>Elle yazacağın:</b> yalnızca yol parası (net, günlük). Hizmet primi (%16, Madde 36) otomatik gelir; hizmet zammı, Profilim’deki işe giriş tarihinden bulunan hizmet yılına göre hesaplanır (Madde 58).</li><li><b>Yevmiye seçimi:</b> iyileştirmesiz ya da iyileştirmeli seçeneği yalnızca 1. dönem içindir. 2. dönemde tek yevmiye vardır.</li><li><b>Aylık fark bordroları:</b> aylara sırayla gir. “Aldığım” kayıtlı maaştan, “alacağım” TİS tutarlarından gelir. Kayıtlı maaşı olmayan aya kayıt yapılamaz.</li><li>Ayrıntıyı kontrol et, ayı <b>kaydet</b> ve sonrakine geç. Toplam sonuç <b>Genel tablo</b>dadır. Bitince <b>Hesaplama tamam, toplam sonucu gör</b> de; hesap kapanır.</li></ol>
<div class=gw><b>⚠️ İmza sonrası maaşlarda fark çıkmaz:</b> TİS imzalandıktan sonra hesaplayıp kaydettiğin maaşlar yeni TİS tutarlarıyla çıkar; bu aylar için fark bordrosu oluşmaz.</div>
<div class=gw><b>⚠️ Fark neden 0,00 ₺ görünüyor?</b> Alacağım bilgileri tamamlanmadan ya da o ay için kayıtlı maaş yokken fark gösterilmez ve 0,00 ₺ yazar. Yol parası bordroda varsa yeni net tutarı yazmadan yol farkı hesaplanmaz.</div>
<div class=gn><b>↩️ Yanlışlıkla kapattıysan:</b> Genel tablodaki <b>Hesabı yeniden aç</b> düğmesine bas. Kayıtlı aylar silinmez.</div>

<h3>9. Yeni zam veya yeni sözleşme gelince</h3>
<p>Zam oranlarını ve yeni TİS tutarlarını geliştirici uygulamaya işler. Sen <b>uygulamayı güncelle</b>, ardından Bilgi ve Veri Girişi’nde yevmiyeni bordronla karşılaştır. Güncelleme sonrası kayıtlı bordro ve fark tutarlarının değişebileceğini unutma; sonucu her zaman bordronla karşılaştır.</p>

<h3>10. Yıllık takip, bordro ve puantaj arşivi, grafik</h3>
<p>Kaydettiğin net maaşlar <b>Ortalama Maaş, Bordro ve Puantajlar</b> ekranında listelenir; geçmiş yılların ortalamaları ve <b>Bordro arşivi</b> orada durur. Aynı ekranda <b>📋 Puantaj arşivi</b> bölümü vardır; onayladığın puantaj kartları orada saklanır, maaşı hesaplayınca kayda “Maaş hesaplandı” ve net maaş eklenir. Ana ekrandaki grafik yalnızca kaydedilmiş ayları gösterir. Maaş ayı Ocak seçilince yeni yıl otomatik başlar.</p>

<h3>11. Yedek, geri yükleme, sıfırlama</h3>
<ol><li><b>☰ Menü → Verileri yedekle:</b> yedeği panoya kopyala ya da PDF olarak paylaş. Yedekte profil, kayıtlı aylar, bordrolar, geriye dönük hesap, görünüm ve şifre vardır.</li><li><b>☰ Menü → Yedeği geri yükle:</b> yedek metnini yapıştır ya da dosyadan yükle. Önce özet gösterir, onayınla uygular.</li><li><b>Yedek hatırlatması:</b> hiç yedek almadıysan ya da son yedeğin 30 günden eskiyse ana ekranda hatırlatma çıkar. “Sonra hatırlat” 7 gün susturur.</li><li><b>☰ Menü → Verileri sıfırla:</b> her şeyi silip ilk kuruluma döner; geri alınamaz.</li></ol>
<div class=gw><b>⚠️ Önemli:</b> Uygulamayı silmeden, telefonu değiştirmeden veya sıfırlamadan önce <b>mutlaka yedek al</b> ve güvenli bir yerde sakla. Yedek kişisel maaş bilgilerini içerir.</div>

<h3>12. Şifre, görünüm, güncelleme, paylaşma</h3>
<ul><li><b>☰ Menü → Şifre:</b> ekran kilidi koyar (veriler şifrelenmez). Şifre oluştururken 12 haneli bir <b>kurtarma kodu</b> verilir; kodu bir yere yaz. Şifreyi unutursan bu kodla kilit kaldırılır.</li><li><b>Görünüm:</b> otomatik, açık veya koyu tema.</li><li><b>Güncelleme:</b> yeni sürüm çıkınca uygulamayı güncelle; verilerin silinmez.</li><li><b>☰ Menü → Uygulamayı paylaş:</b> menünün en üstündeki yeşil düğmeye bas; WhatsApp, Telegram, Facebook, X, SMS veya e-posta ile bağlantıyı gönder ya da kopyala.</li><li><b>☰ Menü → Gizlilik politikası ve Kullanım şartları:</b> verilerinin nerede tutulduğunu ve uygulamayı hangi şartlarla kullandığını okuyabilirsin. Web sayfası bağlantıları da aynı ekranların altındadır.</li></ul>

<h3>13. Sağlık İşçisi Sözleşme Asistanı</h3>
<ul><li><b>Ara:</b> ana ekranın altındaki yeşil kartı veya ☰ Menü → Sözleşme asistanı’nı aç; arama kutusuna kendi cümlenle yaz (ör. gece mesaisi yüzde kaç zamlı).</li><li><b>Madde ve sayfa:</b> her cevabın altında ilgili TİS maddesi ve PDF sayfası görünür. Sözleşmede gör düğmesi TİS Arşivi’ndeki metni açar.</li><li><b>Dönem seç:</b> 2025 ilk dönem, 2025 ikinci dönem, 2026 ilk dönem ve 2026 ikinci dönem seçilince tutarlar o döneme göre gelir. Kesinleşmemiş dönemlerde tutarın yanında tahmini yazar.</li><li><b>Hak hesaplayıcı:</b> gece çalışması, fazla mesai, icap, yemek, resmî tatil ve yıllık izin için kendi verini yaz; brüt tutarı ve güncel vergi diliminize göre net tutarı gör. Günlük ücretin Maaş Hesapla’dan otomatik gelir; yazdığın değerler kaydedilmez.</li><li><b>Favoriler:</b> cevaptaki ☆ Favori düğmesiyle sık baktığın soruları topla. 📤 Paylaş ile cevabı arkadaşına gönder. Son aramaları Temizle düğmesiyle silebilirsin.</li></ul>

stada ise gece döneminde çalışılan saat kadar gece zammı ödenir.","m":"Madde 23","k":"06.00 20.00 gece saatleri 20.00 06.00 gece zammı gece çalışması posta vardiya vardiya gece vardiyası","s":"10"},{"i":"q013","c":"mesai","q":"Gündüz fazla çalışma zammı kaçtır?","a":"Sözleşmedeki fazla çalışma hükmüne göre gündüz fazla çalışması %70 zamlı ödenir. Saat ücreti, günlük brüt çıplak ücretin 7,5 saate bölünmesiyle bulunur.","m":"Madde 22","k":"fazla mesai fazla mesai yüzde 70 gündüz mesaisi mesai ücreti fazla çalışma gece mesaisi gündüz mesaisi yüzde 70 yüzde 75","f":"mesai","p":"mesai","s":"10"},{"i":"q014","c":"mesai","q":"Gece fazla çalışma zammı kaçtır?","a":"Gece dönemindeki fazla çalışma %75 zamlı ödenir.","m":"Madde 22 ve 23","k":"fazla mesai fazla çalışma gece mesaisi gece mesaisi fazla mesai yüzde 75 gece fazla mesai gece saatleri 20.00 06.00 gündüz mesaisi yüzde 70 yüzde 75","f":"mesai","s":"10"},{"i":"q015","c":"mesai","q":"Fazla çalışma nedir, ne zaman ödenir?","a":"Haftalık çalışma süresini aşan çalışmalar fazla çalışmadır. İşverence yaptırılan fazla çalışmanın ücreti, müteakip ayın ücret ödeme döneminde ücretle birlikte ödenir. Fazla çalışmaya kalan üyelere dönüşleri için imkânlar ölçüsünde vasıta sağlanır. Fazla çalışma listeleri onaylandıktan sonra işçilerin görebileceği yere asılır.","m":"Madde 22 ve 28","k":"fazla mesai fazla çalışma gece mesaisi gündüz mesaisi yüzde 70 yüzde 75 fazla çalışma nedir fazla mesai ne zaman ödenir listeler","s":"10"},{"i":"q016","c":"mesai","q":"İcapçı olarak evinde hazır bekleyen işçiye ödeme yapılır mı?","a":"Evet. İcapçı kaldığı her gün için 2 saatlik fazla çalışmaya karşılık gelen ücret ödenir.","m":"Madde 26","k":"icap icap nöbeti icap ücreti evde bekleme icapçı nöbet nöbet izni nöbet parası","f":"icap","s":"11"},{"i":"q017","c":"mesai","q":"İcapçı görev için çağrılırsa ayrıca ödeme yapılır mı?","a":"Evet. İcapçılık sırasında göreve çağrılan işçiye ayrıca fazla çalışma ücreti ödenir. İcapçı olarak göreve çağrılanlara imkânlar ölçüsünde vasıta temin edilir.","m":"Madde 26","k":"icap icapçı nöbet nöbet izni nöbet parası","s":"11"},{"i":"q018","c":"mesai","q":"Normal çalışma saatleri dışında nöbet tutana ne ödenir?","a":"Nöbet tutulan süre kadar fazla çalışma ücreti ödenir veya işçinin rızası alınarak izinle takas edilir.","m":"Madde 26","k":"icap icapçı nöbet nöbet izni nöbet parası nöbet ücreti nöbet parası nöbet izni takas nöbet nasıl hesaplanır","s":"11"},{"i":"q019","c":"mesai","q":"Geçici görevde yol ve gündelik nasıl karşılanır?","a":"Bulunduğu mahallin dışına geçici göreve, kursa veya seminere gönderilen işçiye Bütçe ve Harcırah Kanunu hükümlerine göre ödeme yapılır. Sözleşmeden doğan hakları saklıdır.","m":"Madde 24","s":"11"},{"i":"q020","c":"mesai","q":"Geçici göreve gönderilen işçi avans isteyebilir mi?","a":"Evet. Geçici görev süresince zorunlu giderleri için talebi halinde yeterli avans verilir.","m":"Madde 25","s":"11"},{"i":"q021","c":"mesai","q":"Görev listeleri işçiye duyurulmalı mı?","a":"Evet. Yıllık/haftalık izin, resmi tatil, işe başlama-bırakma, nöbet ve fazla çalışma listeleri onaylandıktan sonra işçilerin görebileceği yerlere asılır; değişiklikler duyurulur.","m":"Madde 28","s":"11"},{"i":"q022","c":"mesai","q":"İşçi kendi kadro unvanı dışında çalıştırılabilir mi?","a":"Esas olan işçinin kendi kadro unvanında/branşında çalıştırılmasıdır. Hizmetin zorunlu kıldığı hallerde başka vasıflı kadroda görevlendirme yapılırsa, bu görev sürdüğü müddetçe yaptığı işin karşılığı haklar verilir.","m":"Madde 29","s":"11"},{"i":"q023","c":"mesai","q":"Her işçi hangi işten sorumludur?","a":"Sözleşmeye göre her işçi yalnız kendisine verilen işten sorumludur.","m":"Madde 29","s":"11"},{"i":"q024","c":"izin","q":"Yıllık izin süresi kaç gündür?","a":"Hizmeti 1 yıldan 10 yıla kadar (10 yıl dahil) olanlara 20 gün; 10 yıldan fazla olanlara 30 gün ücretli yıllık izin verilir.","m":"Madde 30","k":"cumartesi hafta tatili senelik izin yıllık izin yıllık izin hakkım kaç gün senelik izin 20 gün 30 gün şua izni","f":"izin","p":"izin","s":"12"},{"i":"q025","c":"izin","q":"Yıllık izin hesabında cumartesi iş günü sayılır mı?","a":"Evet. Sözleşmede yıllık ücretli izin hesabında cumartesi günü iş günü sayılır.","m":"Madde 30","k":"cumartesi hafta tatili senelik izin yıllık izin şua izni","s":"12"},{"i":"q026","c":"izin","q":"Yıllık izne denk gelen resmi tatil veya hafta tatili yıllık izinden düşer mi?","a":"Hayır. Yıllık izin içine rastlayan ulusal bayram, genel tatil ve hafta tatili günleri ile hastalık izinleri yıllık izin süresine ilave edilir.","m":"Madde 30","k":"cumartesi hafta tatili senelik izin yıllık izin şua izni","s":"12"},{"i":"q027","c":"izin","q":"İşten ayrılan işçinin kullanmadığı yıllık izinleri ne olur?","a":"Kullanılmayan yıllık izin ücretleri işçiye; işçinin ölümü halinde kanuni varislerine ödenir.","m":"Madde 30","k":"cumartesi hafta tatili senelik izin yıllık izin şua izni","s":"12"},{"i":"q028","c":"izin","q":"Şua izni kimlere verilir?","a":"Röntgen mahalli olarak tecrit edilen yerlerle radyum ve radyoterapi hizmetlerinde çalışanlara, yıllık izinden ayrı olarak mevzuat çerçevesinde ücretli şua izni verilir.","m":"Madde 30","k":"cumartesi hafta tatili senelik izin yıllık izin şua izni","s":"12"},{"i":"q029","c":"izin","q":"Hafta tatili hakkı nedir?","a":"İşçiye haftada bir gün ücretli hafta tatili verilir. Vardiya/nöbet değişiminde verilen dinlenme, hafta tatili hakkını ortadan kaldırmaz.","m":"Madde 30","k":"cumartesi hafta tatili senelik izin yıllık izin şua izni","s":"12"},{"i":"q030","c":"izin","q":"Eşi doğum yapan işçiye kaç gün izin verilir?","a":"5 iş günü ücretli mazeret izni verilir. Mazeretin belgelenmesi ve olayın tarihinden itibaren 7 gün içinde başvurulması şarttır.","m":"Madde 30","k":"babalık izni baba izni","s":"12"},{"i":"q031","c":"izin","q":"İşçinin kendisi veya çocuğu evlenirse kaç gün izin verilir?","a":"5 iş günü ücretli mazeret izni verilir. Mazeretin belgelenmesi ve olayın tarihinden itibaren 7 gün içinde başvurulması şarttır.","m":"Madde 30","k":"evlilik izni düğün izni","s":"12"},{"i":"q032","c":"izin","q":"Anne, baba, eş, çocuk veya kardeş vefatında izin kaç gündür?","a":"Ana, baba, eş, çocuk, kardeş veya bakmakla yükümlü olunan birinin ölümünde 5 işgünü; kayınvalide veya kayınpederin ölümünde 3 işgünü ücretli izin verilir. Mazeretin belgelenmesi ve olayın tarihinden itibaren 7 gün içinde başvurulması şarttır.","m":"Madde 30","k":"ölüm izni cenaze izni taziye","s":"12"},{"i":"q033","c":"izin","q":"Doğal afet halinde mazeret izni var mı?","a":"Belgelendirilmesi ve sözleşmedeki başvuru koşullarına uyulması halinde 7 iş günü ücretli mazeret izni verilir. Mazeretin belgelenmesi ve olayın tarihinden itibaren 7 gün içinde başvurulması şarttır.","m":"Madde 30","k":"doğum izni evlilik izni mazeret izni refakat izni saatlik izin ölüm izni","s":"12"},{"i":"q034","c":"izin","q":"Engelli veya süreğen hastalığı olan çocuğun tedavisi için izin var mı?","a":"En az %60 engelli veya süreğen hastalığı olan çocuğun tedavisinde, rapora dayanarak ve çalışan ebeveynlerden yalnızca biri kullanmak kaydıyla yılda 10 güne kadar ücretli izin verilir. Her çocuk için ayrı uygulanır.","m":"Madde 30","s":"12"},{"i":"q035","c":"izin","q":"Eş, çocuk, anne veya babaya refakat için izin var mı?","a":"Tedavi için lüzum görülmesi halinde, belgelendirilmek kaydıyla refakat edecek sendika üyesi işçiye takvim yılında en çok 10 güne kadar ücretli izin verilir.","m":"Madde 30","s":"12"},{"i":"q036","c":"izin","q":"Saatlik izin hakkı ne kadardır?","a":"Resmi daire işleri ile şahsi ve ailevi mazeretler için günde 4, ayda toplam 8 saati geçmemek üzere ücretli mazeret izni verilir.","m":"Madde 30","k":"doğum izni evlilik izni mazeret izni refakat izni saatlik izin ölüm izni","s":"13"},{"i":"q037","c":"izin","q":"İdari izin verilebilir mi?","a":"Zorunlu nedenlerle, yıllık izni bulunmayan işçiye bir yıl içinde 10 güne kadar; zaruret halinde aynı usulle 10 gün daha idari izin verilebilir. İkinci defa verilen izin müteakip yıl izninden mahsup edilir.","m":"Madde 30","k":"idari izin","s":"12"},{"i":"q038","c":"izin","q":"Ücretsiz izin talep edilebilir mi?","a":"Meşru mazerete dayanarak işveren onayıyla takvim yılında 45 güne kadar ücretsiz izin verilebilir; işveren uygun görürse aynı şartlarla 45 gün daha uzatabilir. Madde 30’daki özel ücretsiz izin halleri ayrıca uygulanır.","m":"Madde 30","k":"ücretsiz izin izinsiz","s":"13"},{"i":"q039","c":"izin","q":"Ramazan ve Kurban Bayramlarında izin düzenlemesi var mı?","a":"İşin özelliği çalışmayı gerektirse dahi her işçiye Ramazan ve Kurban bayramlarında en az birer gün ücretli izin kullandırılır.","m":"Madde 30","k":"bayram izni bayram tatili","s":"13"},{"i":"q040","c":"ucret","q":"2025 başında günlük brüt çıplak ücreti 1.400 TL’nin altında olan işçinin ücreti ne olur?","a":"01.01.2025 itibarıyla günlük brüt çıplak ücret 1.400 TL’ye yükseltilir.","m":"Madde 33","s":"14"},{"i":"q041","c":"ucret","q":"2025 başında günlük brüt çıplak ücreti 1.400 TL veya üzerinde olan işçiye ne yapılır?","a":"01.01.2025 itibarıyla günlük brüt çıplak ücrete 40 TL seyyanen zam yapılır. Taban ücret artışından yararlanan işçiye aynı seyyanen zam ayrıca uygulanmaz.","m":"Madde 33","s":"14"},{"i":"q042","c":"ucret","q":"2025 ilk altı ay ücret zammı nedir?","a":"Taban ücret/seyyanen zam düzenlemesinden sonra oluşan günlük brüt çıplak ücrete %24 zam uygulanır.","m":"Madde 33","s":"14"},{"i":"q043","c":"ucret","q":"2025 ikinci altı ay ücret zammı nedir?","a":"2025’in ikinci altı ayında (01.07.2025) önce 50 TL/gün seyyanen zam, sonra %11 zam yapılır. TÜFE’nin Haziran 2025’ten Aralık 2025’e değişimi %11’i aşarsa aşan kısmın tamamı 01.01.2026 (ikinci yıl birinci altı ay) zammına eklenir.","m":"Madde 33","s":"14"},{"i":"q044","c":"ucret","q":"2026 ücret artışları nasıl belirlenir?","a":"01.01.2026’da %10, 01.07.2026’da %6 zam yapılır. TÜFE’nin Aralık 2025’ten Haziran 2026’ya değişimi %10’u aşarsa aşan kısmın tamamı 01.07.2026 zammına eklenir. Aralık 2026 TÜFE’si Haziran 2026’ya göre %6’yı aşarsa aşan kısım, 01.01.2027 tarihinden itibaren 31.12.2026 tarihindeki günlük brüt çıplak ücrete ilave edilir.","m":"Madde 33","s":"14"},{"i":"q045","c":"ucret","q":"Yeni işe giren işçinin işe giriş ücreti nasıl belirlenir?","a":"Açıktan ilk defa işe alınanlar asgari ücretle işe başlar. Deneme süresini tamamlayıp sendikaya üye olunca işe giriş ücreti yükseltilir: 01.01.2025–30.06.2025 döneminde 1.835,00 TL/gün, 01.07.2025–31.12.2025 döneminde 2.090,00 TL/gün. Bu işçiler, işe girdikleri dönemin ücret zamlarından ayrıca yararlanamaz. Bu ücretler ikinci yıl zam tarihlerinde zam oranında artırılır.","m":"Madde 33","s":"14"},{"i":"q046","c":"ucret","q":"Ücret ne zaman ödenir?","a":"Hak edilen ücretler her ayın sonunda işlenmiş olarak ödenir; ücret hesabı günlük yapılır.","m":"Madde 34","s":"16"},{"i":"q047","c":"ucret","q":"İşçiye bordro/hesap pusulası verilmesi gerekir mi?","a":"Evet. Ödeme günü ve dönemi, asıl ücrete yapılan eklemeler ve her çeşit kesinti ayrı ayrı gösterilmelidir.","m":"Madde 34","s":"16"},{"i":"q048","c":"ucret","q":"İşçinin ücretinden yazılı rızası olmadan kesinti yapılabilir mi?","a":"Kanuni kesintiler dışında, işçinin yazılı rızası olmadan ücretinden kesinti yapılamaz.","m":"Madde 34","k":"maaş kesintisi kesinti maaştan kesme","s":"16"},{"i":"q049","c":"ucret","q":"Puantaj veya tahakkuk hatası nasıl düzeltilir?","a":"Hata tespit edildiği ayı takip eden aybaşında karşılıklı mahsuplaşılır.","m":"Madde 34","s":"16"},{"i":"q050","c":"ucret","q":"İkramiye hakkı nedir?","a":"İlave tediyeye ek olarak her yıl 60 günlük ücret tutarında ikramiye ödenir. Çalışılan süreyle orantılıdır; Mart ve Eylül aylarında iki eşit taksitte ödenir.","m":"Madde 35","k":"hizmet primi ikramiye ikramiye ne zaman ikramiye kaç gün mart eylül ilave tediye risk tazminatı sosyal yardım tediye ilave tediye ödeme tarihi","p":"ikramiye","s":"16"},{"i":"q051","c":"ucret","q":"İlave tediye ne zaman ödenir?","a":"6772 sayılı Kanuna göre ödenir; ödeme tarihleri Cumhurbaşkanınca belirlenir. Çalışılan süreyle orantılıdır.","m":"Madde 35","k":"hizmet primi ikramiye ilave tediye risk tazminatı sosyal yardım tediye ilave tediye ödeme tarihi","s":"16"},{"i":"q052","c":"ucret","q":"Diğer işçilere hizmet primi ne kadardır?","a":"Teknik elemanlar dışında kalan işçilere aylık çıplak ücretlerinin %16’sı tutarında hizmet primi brüt ödenir. Bu kalem çalışma yılına bağlı değildir; günlük ücrete oransal olarak eklenir. Hizmet yılına göre verilen ayrı kalem hizmet zammıdır (Madde 58).","m":"Madde 36","k":"hizmet primi yüzde 16 yüzde on altı kamu çerçeve protokolü ücretin yüzde 16sı","p":"hprim","s":"16"},{"i":"q053","c":"ucret","q":"Teknik elemanların hizmet primi nasıl düzenlenmiştir?","a":"Şartları sağlayan teknik elemanlara, emsal memur personele ödenen iş güçlüğü, iş riski, temininde güçlük zammı ve özel hizmet tazminatı tutarı hizmet primi olarak net ödenir. Ayrıca aylık çıplak ücretlerinin %3’ü tutarında hizmet primi brüt ödenir. Teknik eleman olarak çalışmak için en az ortaöğretim (meslek lisesi, teknik lise veya dengi) mezunu olmak ve eğitimin mesleğe uygun olması, ilk girişteki mesleki görevi fiilen yürütmek şarttır.","m":"Madde 36 ve Ek Madde 3","k":"hizmet primi hizmet primi yüzde 16 ikramiye ilave tediye risk tazminatı sosyal yardım","s":"16"},{"i":"q054","c":"ucret","q":"Şoförlere meslek-risk tazminatı ödenir mi?","a":"Evet. Seçili dönemde şoförlere brüt {{sofor}} (günlük), ambulans şoförlerine (%100 artırımlı) brüt {{ambulans}} (günlük) meslek-risk tazminatı ödenir.","m":"Madde 37","k":"hizmet primi ikramiye ilave tediye risk tazminatı sosyal yardım şoför tazminatı ambulans şoförü risk tazminatı","s":"16"},{"i":"q055","c":"ucret","q":"Sosyal yardım ne kadardır?","a":"Seçili dönemde brüt {{sosyal}} (aylık). Ücretli izinlerde ve sözleşmede sayılan istirahat hallerinde kesinti yapılmaz.","m":"Madde 38","k":"hizmet primi ikramiye ilave tediye risk tazminatı sosyal yardım sosyal yardım parası sosyal yardım tutarı","f":"tablo","s":"16"},{"i":"q056","c":"ucret","q":"Yemek yardımı hangi durumda nakit ödenir?","a":"Çalışılan günlerde yemek verilmesi mümkün değilse; sağlık kurulu raporuyla özel beslenme rejimi belgelenmişse veya Ramazan’da oruç nedeniyle yemek hakkından yararlanılamıyorsa çalışılan gün başına nakit yemek yardımı ödenir.","m":"Madde 39","k":"servis ulaşım yemek parası yemek yardımı yol parası","s":"17"},{"i":"q057","c":"ucret","q":"Yemek yardımı tutarı ne kadardır?","a":"Seçili dönemde net {{yemek}} (günlük). Yemek verilemeyen çalışılan günler için nakit ödenir.","m":"Madde 39","k":"servis ulaşım yemek parası yemek parası yemek yardımı ne kadar yemek ücreti yemek yardımı yol parası","f":"yemek","s":"17"},{"i":"q058","c":"ucret","q":"Yarım gün çalışmada yemek hakkı var mı?","a":"Evet. Yarım gün çalışılan günlerde de işçi yemek hakkından yararlanır.","m":"Madde 39","s":"17"},{"i":"q059","c":"ucret","q":"İkili vardiyada yemek hakkı kaç öğündür?","a":"İkili vardiya/posta şeklinde çalışanlara iki öğün yemek verilir. Yemek verilemezse öğün başına sözleşmedeki yemek bedeli ödenir.","m":"Madde 39","k":"06.00 20.00 gece zammı gece çalışması posta vardiya","s":"17"},{"i":"q060","c":"ucret","q":"Servis yoksa yol ücreti nasıl karşılanır?","a":"İşveren servis sağlamazsa fiilen çalışılan günler için gidiş ve dönüş olmak üzere iki belediye otobüsü biletinin rayiç bedeli net ödenir. Büyükşehirde birden fazla araç değiştirenlere sözleşmedeki koşullarla dört bilet bedeli uygulanır.","m":"Madde 40","k":"servis ulaşım yemek parası yemek yardımı yol parası yol parası ulaşım servis otobüs bileti","s":"17"},{"i":"q061","c":"ucret","q":"Özel toplu taşıma aracı bulunan, belediye toplu taşıması olmayan yerde yol yardımı nedir?","a":"Seçili dönemde net {{yol}} (aylık). Sözleşmede belirtilen il merkezi iki bilet rayiç bedeli üst sınırı uygulanır.","m":"Madde 40","k":"yol parası yol yardımı ulaşım servis","s":"17"},{"i":"q062","c":"ucret","q":"Giyim yardımı ne zaman ve ne kadar ödenir?","a":"Sendikalı işçilere yılda bir kez Eylül ayında 2025 yılı için brüt 2.810,19 TL ödenir. İkinci yılda bir kez, ödendiği dönemin ücret zammı oranında artırılır. Koruyucu iş kıyafeti/ekipmanı ayrıca verilir.","m":"Madde 41","k":"giyim parası kıyafet yardımı iş kıyafeti","s":"17","p":"giyim"},{"i":"q063","c":"ucret","q":"Evlenme yardımı ne kadardır?","a":"Seçili dönemde brüt {{evlenme}} ödenir.","m":"Madde 42","k":"evlenme parası evlilik yardımı düğün yardımı","s":"17"},{"i":"q064","c":"ucret","q":"Doğum yardımı ne kadardır?","a":"Doğumu belgeleyen işçiye seçili dönemde brüt {{dogum}} ödenir.","m":"Madde 43","k":"doğum parası doğum yardımı bebek","s":"18"},{"i":"q065","c":"ucret","q":"Ölüm yardımı hangi hallerde ödenir?","a":"İşçinin ölümü halinde kanuni varislerine; eşinin, çocuğunun, anne veya babasının ölümü halinde işçiye bir aylık çıplak ücreti tutarında ölüm yardımı yapılır.","m":"Madde 43","p":"olum","s":"18"},{"i":"q066","c":"ucret","q":"Kreş açılma koşulu nedir?","a":"150 veya daha fazla kadın işçi çalıştırılan her işyeri için kreş açılır. Eşik altında emzirme odası açılması düzenlenmiştir. Kreş açılması gereken yerde açılmamışsa ve durum belgelenirse kadın işçiye kreş yardımı ödenir.","m":"Madde 44","k":"kreş yardımı kreş parası çocuk bakımı","s":"18"},{"i":"q067","c":"ucret","q":"Kreş yardımı ne kadardır?","a":"Kreş açılması gereken yerde açılmamış ve durum belgelenmişse kadın işçiye seçili dönemde brüt {{kres}} (aylık) ödenir.","m":"Madde 44","k":"kreş yardımı kreş parası çocuk bakımı","s":"18"},{"i":"q068","c":"izin","q":"Süt izni ne kadardır?","a":"Bir yaşından küçük çocuğunu emzirmesi için kadın işçiye günde toplam 1,5 saat süt izni verilir. Kullanılacağı saatleri ve bölünme şeklini işçi belirler; süre günlük çalışma süresinden sayılır.","m":"Madde 45","k":"emzirme izni süt izni bebek emzirme","s":"18"},{"i":"q069","c":"ucret","q":"Emzirme/süt parası ne kadardır?","a":"Emzikli kadınlara 6 ay süreyle seçili dönemde brüt {{sut}} (aylık) ödenir.","m":"Madde 45","k":"emzirme izni süt izni bebek emzirme","s":"18"},{"i":"q070","c":"ucret","q":"Radyasyon ve belirli riskli birimlerde süt yardımı var mı?","a":"Sözleşmede sayılan röntgen, radyum, fizyoterapi, radyoterapi, boya-badana, kaynak, kalorifer, çamaşırhane ve bulaşıcı hastalık servislerinde fiilen çalışılan günlerde yarım kilogram süt verilir. Verilmezse seçili dönemde brüt {{sutpara}} (günlük) süt parası ödenir.","m":"Madde 50","s":"19"},{"i":"q071","c":"ucret","q":"Hastalık nedeniyle viziteye çıkan işçinin ücretinden kesinti yapılır mı?","a":"Hayır. Hastalık nedeniyle viziteye çıkılması halinde ücret kesintisi yapılamaz.","m":"Madde 49","s":"19"},{"i":"q072","c":"ucret","q":"İstirahat alan işçiye ücret farkı ödenir mi?","a":"Sözleşmede, SGK geçici iş göremezlik ödeneği ile esas ücret arasındaki farkın işverence ödenmesi düzenlenmiştir. SGK’nın ödemediği ilk iki gün de bir takvim yılında en fazla dört defa olmak üzere işverence ödenir.","m":"Madde 49","s":"19"},{"i":"q073","c":"ucret","q":"Kıdem tazminatı hesabında kaç günlük ücret esas alınır?","a":"Kıdem tazminatı konusunda yasa hükümleri uygulanır; kıdemin hesabında her hizmet yılı için işçinin 35 günlük ücreti temel alınır. 01.02.1987’den sonra işe girenlere yasa hükümleri uygulanır. 31.12.2012’den önceki toplu iş sözleşmelerindeki kıdem gün sayısı daha yüksekse, bu işçiler için şahsa bağlı olarak yüksek olan gün sayısı uygulanır.","m":"Madde 32","k":"kıdem tazminatı işten çıkış tazminat","s":"14"},{"i":"q074","c":"ucret","q":"İhbar süreleri nasıl uygulanır?","a":"4857 sayılı İş Kanunu’nun 17. maddesindeki ihbar süreleri birer hafta artırılarak uygulanır; sözleşmede 01.02.1987 sonrasında işe girenler için özel istisna vardır.","m":"Madde 32","k":"ihbar süresi ihbar tazminatı","s":"14"},{"i":"q075","c":"ucret","q":"Kıdemli işçilik teşvik primi kimlere verilir?","a":"Kurumda fiilen (başka kamu kurumlarında geçen süreler dahil) 20 yıl hizmeti olan kadın ve 25 yıl hizmeti olan erkek işçiye müteakip ay bir aylık ücret tutarında teşvik primi ve teşekkür belgesi verilir.","m":"Madde 47","k":"kıdem teşvik primi 20 yıl 25 yıl","s":"19"},{"i":"q076","c":"disiplin","q":"İşe mazeretsiz geç gelmenin veya izinsiz mesai bitmeden işi bırakmanın cezası nedir?","a":"1. defa İhtar; 2. defa 1 Y.; 3. defa 3 Y.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 1","k":"geç kalma geç gelmek cezası","s":"25"},{"i":"q077","c":"disiplin","q":"Mazeretsiz bir işgünü işe gelmemenin cezası nedir?","a":"1. defa 1 Y.; 2. defa 3 Y.; 3. defa İ.Ç.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 2","k":"devamsızlık işe gelmeme cezası","s":"25"},{"i":"q078","c":"disiplin","q":"Tatil gününü takip eden 1 işgünü veya art arda 2 işgünü mazeretsiz işe gelmemenin cezası nedir?","a":"1. defa 3 Y.; 2. defa İ.Ç.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 3","k":"devamsızlık işe gelmeme cezası","s":"25"},{"i":"q079","c":"disiplin","q":"Göreve alkollü gelmenin veya işyerinde alkol almanın cezası nedir?","a":"1. defa 3 Y.; 2. defa İ.Ç.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 4","k":"alkol uyuşturucu işe sarhoş gelmek","s":"25"},{"i":"q080","c":"disiplin","q":"Mesai saatinde işi yapmamanın, özel işle ilgilenmenin veya işyeri malzemesini kendi işinde kullanmanın cezası nedir?","a":"1. defa 1 Y.; 2. defa 3 Y.; 3. defa 5 Y.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 5","s":"25"},{"i":"q081","c":"disiplin","q":"Mesai saatinde başkalarını meşgul etmenin, kendi işi dışında işle uğraşmanın veya kaba davranmanın cezası nedir?","a":"1. defa İhtar; 2. defa 1 Y.; 3. defa 2 Y.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 6","s":"25"},{"i":"q082","c":"disiplin","q":"İşverenin emniyetiyle görevli olanların görev sırasında uyumasının cezası nedir?","a":"1. defa 1 Y.; 2. defa 3 Y.; 3. defa İ.Ç.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 7","s":"25"},{"i":"q083","c":"disiplin","q":"Amirine hakaret etmek veya tehditte bulunmanın cezası nedir?","a":"1. defa 4 Y.; 2. defa İ.Ç.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 8","k":"amire hakaret kavga","s":"25"},{"i":"q084","c":"disiplin","q":"İş arkadaşına veya hasta/hasta yakınına fiili saldırıda bulunmanın cezası nedir?","a":"1. defa 5 Y.; 2. defa 6 Y.; 3. defa İ.Ç.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 9","k":"kavga dayak şiddet saldırı","s":"25"},{"i":"q085","c":"disiplin","q":"İş arkadaşına hakaret/tehdit etmenin veya işyeri düzenini bozmanın cezası nedir?","a":"1. defa İhtar; 2. defa 3 Y.; 3. defa 5 Y.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 10","s":"25"},{"i":"q086","c":"disiplin","q":"Tehlikeye düşen alet, malzeme veya kişilere yardım etmemenin cezası nedir?","a":"1. defa 4 Y.; 2. defa 6 Y.; 3. defa İ.Ç.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 11","s":"25"},{"i":"q087","c":"disiplin","q":"Dikkatsizlik veya tedbirsizlikle zarara sebep olmanın cezası nedir?","a":"1. defa İhtar; 2. defa 3 Y.; 3. defa 5 Y. Zarar ayrıca tazmin ettirilir.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 12","s":"25"},{"i":"q088","c":"disiplin","q":"Koruyucu malzemeyi kullanmamanın veya korumamanın cezası nedir?","a":"1. defa 1 Y.; 2. defa 3 Y.; 3. defa 5 Y.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 13","k":"hasta mahremiyeti iş güvenliği kişisel koruyucu donanım koruyucu ekipman taciz","s":"25"},{"i":"q089","c":"disiplin","q":"Verilen alet ve malzemenin periyodik bakımını ihmal etmenin cezası nedir?","a":"1. defa 3 Y.; 2. defa 5 Y.; 3. defa 6 Y.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 14","k":"görevi ihmal","s":"25"},{"i":"q090","c":"disiplin","q":"Görevini ihmal etmenin cezası nedir?","a":"1. defa İhtar; 2. defa 1 Y.; 3. defa 2 Y.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 15","k":"görevi ihmal","s":"25"},{"i":"q091","c":"disiplin","q":"Mesaisine gelmeyen arkadaşı yerine imza atmanın veya kart basmanın cezası nedir?","a":"1. defa 3 Y.; 2. defa 5 Y.; 3. defa İ.Ç.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 16","k":"devamsızlık disiplin geç kalma ihtar imza kart basma kart basmak imza atmak başkası yerine","s":"25"},{"i":"q092","c":"disiplin","q":"İşçileri ilgisiz dernek veya kuruluşlara kayda ya da bağışa zorlamanın cezası nedir?","a":"1. defa İhtar; 2. defa İ.Ç.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 17","s":"25"},{"i":"q093","c":"disiplin","q":"Tedavi için girdiği ev halkının mahrem bilgilerini açık etmenin cezası nedir?","a":"1. defa 6 Y.; 2. defa İ.Ç.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 18","s":"25"},{"i":"q094","c":"disiplin","q":"Görevini yaparken keyfi veya garezen kişilerin zararına sebep olmanın cezası nedir?","a":"1. defa 6 Y.; 2. defa İ.Ç.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 19","s":"25"},{"i":"q095","c":"disiplin","q":"İşle ilgili verilen emirlere/talimatlara itiraz etmenin cezası nedir?","a":"1. defa 1 Y.; 2. defa 2 Y.; 3. defa 3 Y.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 20","s":"25"},{"i":"q096","c":"disiplin","q":"Hatırlatıldığı halde görevini yapmamakta ısrar etmenin veya savsaklamanın cezası nedir?","a":"1. defa 1 Y.; 2. defa 4 Y.; 3. defa İ.Ç.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 21","s":"25"},{"i":"q097","c":"disiplin","q":"Yetkisiz olarak basına, haber ajansına, radyo veya televizyona bilgi vermenin cezası nedir?","a":"1. defa 1 Y.; 2. defa 3 Y.; 3. defa 5 Y.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 22","s":"25"},{"i":"q098","c":"disiplin","q":"Yalan/yanlış beyanda bulunmanın veya işverenin itibarını sarsacak davranışın cezası nedir?","a":"1. defa 2 Y.; 2. defa 5 Y.; 3. defa İ.Ç.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 23","s":"25"},{"i":"q099","c":"disiplin","q":"Ağır disiplin fiilleri nelerdir?","a":"Ek-1 sıra 24’te sayılan fiiller doğrudan işten çıkarma (İ.Ç.) cezası gerektirir. Başlıcaları: mazeretsiz tatil gününü takip eden 3 işgünü veya art arda 4 işgünü ya da yılda 5 işgünü işe gelmemek; terör örgütleriyle eylem birliği; savaş, olağanüstü hal veya afette emirleri yapmamak; kurumun huzurunu bozmak, boykot, işgal, işi yavaşlatma; görevde ayrımcılık; resmî belgede tahrifat veya sahte belge; amire fiili saldırı; cinsel taciz; rüşvet, irtikap, iş takibi; hırsızlık; uyuşturucu/uyarıcı madde etkisinde gelmek veya kullanmak; yüz kızartıcı ve utanç verici hareketler; görevin imkânlarından yararlanıp maddi çıkar sağlamak.","m":"Ek-1 Disiplin Ceza Cetveli, sıra 24","k":"devamsızlık disiplin geç kalma ihtar imza işten çıkarma işten çıkarma kovulma kovulmak kovulur atılmak ağır ceza ağır disiplin fiilleri kart basma yevmiye","s":"26"},{"i":"q100","c":"disiplin","q":"Disiplin cezası verilirken işçinin geçmişi dikkate alınabilir mi?","a":"İşyeri disiplin kurulu itiraz edilen ceza yerine, Üst Disiplin Kurulu teklif edilen işten çıkarma yerine; işçinin çalışma durumunu ve geçmiş hizmetlerinin olumlu olmasını göz önüne alarak bir alt cezaya hükmedebilir.","m":"Madde 53/C","k":"devamsızlık disiplin geç kalma ihtar imza kart basma","s":"21"},{"i":"q101","c":"disiplin","q":"Disiplin kurulunda işçi veya tanık dinlenebilir mi?","a":"Kurul, ihtiyaç halinde ceza istenen işçiyi veya tanıkları dinleyebilir. Kararlar toplantıya katılanların çoğunluğuyla alınır; eşitlik halinde başkanın bulunduğu taraf çoğunluğu sağlar.","m":"Madde 53/B","k":"devamsızlık disiplin geç kalma ihtar imza kart basma","s":"21"},{"i":"q102","c":"disiplin","q":"Disiplin kurulu kararı işçiye bildirilir mi?","a":"Evet. Alınan karar işçiye tebliğ edilir ve kararın bir örneği özlük dosyasında saklanır.","m":"Madde 53/C","k":"devamsızlık disiplin geç kalma ihtar imza kart basma","s":"21"},{"i":"q103","c":"disiplin","q":"Toplu iş sözleşmesinin yorumundan doğan uyuşmazlıklar nasıl çözülür?","a":"Öncelikle Uyuşmazlıkları Çözüm Kurulu’nda ele alınır. Kurul taraf temsilcilerinden oluşur; başvuru üzerine mümkün olan en kısa sürede toplanır ve 15 gün içinde karar verir. Kurul, davetten sonra 3 işgünü içinde toplanır ve 15 gün içinde karar verir.","m":"Madde 54","s":"22"},{"i":"q104","c":"diger","q":"Askerlik nedeniyle işten ayrılan işçinin dönüş hakkı var mı?","a":"Muvazzaf askerlik nedeniyle ayrılan işçi ücretsiz izinli sayılır. Askerlik bitiminden itibaren iki ay içinde işe dönmek isterse işveren eski iş ve işyerinde işe almak zorundadır.","m":"Madde 46","k":"askerlik dönüş askere gitmek ücretsiz izin izinsiz","s":"19"},{"i":"q105","c":"diger","q":"Hastalık nedeniyle (vizite) ücretimden kesinti yapılır mı?","a":"İşçinin hastalık sebebiyle viziteye çıkması halinde ücretinden kesinti yapılamaz. Hastalığı yüzünden tedaviye alınan veya istirahatli olan işçilere SGK’nın ödediği geçici iş göremezlik ödeneği ile esas ücreti arasındaki fark işyeri tarafından ödenir. Sosyal yardım ödemesinde de iş kazası ve meslek hastalığı istirahati kesinti nedeni değildir (Madde 38).","m":"Madde 49","s":"19"},{"i":"q106","c":"diger","q":"İşveren iş sağlığı ve güvenliği tedbirlerini almak zorunda mı?","a":"Evet. İşveren mevzuatın yüklediği gerekli iş sağlığı ve güvenliği tedbirlerini alır; mevzuat gereği komisyonlarda işçi temsilcisi bulundurulması gereken hallerde temsilci bulundurulur.","m":"Madde 50","s":"19"},{"i":"q107","c":"diger","q":"İşçinin olağanüstü gayreti ödüllendirilebilir mi?","a":"Evet. Emsallerine göre üstün başarı sağlayan işçiye takdirname ve ödül verilebilir; taltif edilenler yıl sonunda ilan edilir.","m":"Madde 48","s":"19"},{"i":"q108","c":"diger","q":"Ölüm yardımı hangi hallerde ve ne kadar ödenir?","a":"İşçinin kendi ölümünde kanuni varislerine, işçinin eşi, çocuğu, annesi veya babasından birinin ölümünde işçiye bir aylık çıplak ücreti tutarında ölüm yardımı yapılır. Cenaze masrafları mevzuata göre işlem görür.","m":"Madde 43","p":"olum","s":"18"},{"i":"q109","c":"diger","q":"İşçinin tutuklanması halinde sözleşme ne olur?","a":"Gözetim, tutukluluk, mahkûmiyet ve tekrar işe başlatma halleri Madde 31’de ayrıntılı olarak düzenlenmiştir. Sonuç; suçun niteliği, süre, karar ve başvuru zamanına göre değişir; otomatik tek bir cevapla değerlendirilmemelidir.","m":"Madde 31","k":"tutuklama hapis gözaltı","s":"13"},{"i":"x01","c":"mesai","q":"Resmi tatilde çalışırsam ne alırım?","a":"Hafta tatili, ulusal bayram ve genel tatil günlerinde çalışmayı işin özelliği gerektiriyorsa, işçiye çalışılan her gün için normal yevmiyesinin dışında iki yevmiye daha ödenir. Bu günlerdeki çalışma süresi günlük çalışma süresini aşarsa, aşan kısım için ayrıca fazla çalışma ücreti ödenir.","m":"Madde 22/e","k":"resmi tatil bayram genel tatil hafta tatili ulusal bayram bayramda çalışmak tatil mesai iki yevmiye","f":"tatil","n":"Uygulamadaki hesapta tatil gününde çalışılan her gün tam gün sayılır; yarım gün veya arefe için ayrı hesap yapılmaz.","p":"tatil","s":"10"},{"i":"x02","c":"ucret","q":"Yemek ve yol yardımı ne kadar?","a":"Yemek yardımı seçili dönemde net {{yemek}} (günlük). Servis yoksa yol ücreti, fiilen çalışılan günler için gidiş-dönüş iki belediye otobüsü bileti rayiç bedeli net olarak ödenir; bilet bedeli ile ve işyerine göre değiştiği için uygulamada yol ücretini sen yazarsın (Yan haklar). Belediye toplu taşıması olmayan yerde aylık net {{yol}} ödenir.","m":"Madde 39 ve 40","k":"yemek parası yol parası ulaşım servis yemek yardımı yol yardımı ne kadar","f":"yemek","s":"17"},{"i":"x03","c":"ucret","q":"Evlenme ve doğum yardımı ne kadar?","a":"Evlenme yardımı seçili dönemde brüt {{evlenme}}; doğum yardımı brüt {{dogum}} tutarındadır. Doğumu belgelemek gerekir.","m":"Madde 42 ve 43","k":"evlenme parası doğum parası evlilik yardımı bebek yardımı sosyal haklar","f":"tablo","s":"17"},{"i":"x04","c":"ucret","q":"Maaşıma hangi zamlar uygulanır?","a":"2025 ilk altı ay %24; ikinci altı ay 50 TL/gün seyyanen zam ve %11; 2026 ilk altı ay %10; ikinci altı ay %6. Enflasyon farkı: Haziran→Aralık 2025 TÜFE’si %11’i aşarsa aşan kısım 2026 ilk altı ay zammına, Aralık 2025→Haziran 2026 TÜFE’si %10’u aşarsa aşan kısım 2026 ikinci altı ay zammına eklenir; Haziran→Aralık 2026 TÜFE’si %6’yı aşarsa aşan kısım 01.01.2027’den itibaren eklenir. Güncel oranlar Bilgi ve Veri Girişi ekranındadır.","m":"Madde 33","k":"zam oranı maaş zammı enflasyon farkı yevmiye zammı","s":"14"},{"i":"n01","c":"mesai","q":"Mesai dışında göreve çağrılırsam en az kaç saatlik ücret alırım?","a":"Zorunlu hallerde yeniden göreve çağrılan işçiye, yolda geçen süreler dahil 3 saatten az olmamak üzere ve çalışılan süre kadar fazla çalışma ücreti ödenir.","m":"Madde 22/b","k":"fazla mesai göreve çağrılmak yeniden çağrılma 3 saat çağrı","s":"10"},{"i":"n02","c":"mesai","q":"Hafta tatili veya bayramda çalışma süresi günlük süreyi aşarsa ne olur?","a":"Hafta tatili, genel tatil ve ulusal bayram günlerindeki çalışma süresi günlük çalışma süresini aşarsa, haftalık çalışma süresine bakılmaksızın aşan kısım için ayrıca fazla çalışma ücreti ödenir.","m":"Madde 22/e","k":"tatil günü fazla mesai bayram mesaisi aşan süre","s":"10"},{"i":"n03","c":"mesai","q":"Vardiya değişiminde kaç saat dinlenme verilir?","a":"İkili vardiya sisteminde işçiler vardiya değişiminde sürekli en az 11 saat dinlendirilmeden çalıştırılamaz. Üçlü vardiyada vardiyalı çalışma saatleri arasında en az 16,5 saat zaman aralığı bulundurulur. Vardiya dönüşlerinde veya zorunlu sebeplerle 7,5 saat ara ile vardiyaya çağrılan işçinin sonraki 7,5 saatlik çalışması fazla çalışma sayılır.","m":"Madde 21","k":"vardiya dinlenme posta nöbet değişimi 11 saat 16,5 saat","s":"10"},{"i":"n04","c":"mesai","q":"Radyasyonla çalışanın haftalık çalışma süresi kaç saattir?","a":"İyonlaştırıcı radyasyonla teşhis, tedavi veya araştırma yapılan yerlerde ve bu iş veya işlemlerde çalışan personelin haftalık çalışma süresi 35 saattir. Radyasyon doz limitleri ayrıca dikkate alınır; işe başlamadan önce tıbbi muayene, sonrasında yıllık sağlık kontrolü yapılır.","m":"Madde 20/2","k":"radyasyon röntgen 35 saat haftalık çalışma şua","s":"9"},{"i":"n05","c":"mesai","q":"Hangi süreler günlük çalışma süresinden sayılır?","a":"Bir işi yapmak veya takip etmek için yolda geçen süre; işçinin işinde ve her an buyruğa hazır beklemekle beraber iş verilmeksizin boşta geçen süreler; kadın işçilerin çocuğunu emzirmekle geçirdiği nizami süreler (süt izni) ve vardiya sisteminde işin ortalama bir zamanında verilen 30 dakikalık yemek izni günlük çalışma süresinden sayılır.","m":"Madde 20/3","k":"günlük çalışma süresi yemek izni 30 dakika yolda geçen süre","s":"9"},{"i":"n06","c":"mesai","q":"Doğal afette çalışırsam ek ödeme alır mıyım?","a":"Tabii afet hallerinde çalışanlar hakkında Cumhurbaşkanlığı kararına göre işlem yapılır. Böyle bir karar alınmamışsa, afetin meydana geldiği çevredeki işyerlerinde çalışan işçilere Uyuşmazlıkları Çözüm Kurulunca tespit edilen süre boyunca, diğer haklarından ayrı olarak günlük çıplak ücretin %50’si oranında tazminat verilir.","m":"Madde 27","k":"doğal afet deprem olağanüstü hal tazminat yüzde 50","s":"11"},{"i":"n07","c":"ucret","q":"Hizmet zammı ne kadardır?","a":"Taraf sendikaya üye işçilere, kamu kurum ve kuruluşunda geçirdikleri her tam hizmet yılı için seçili dönemde brüt {{hizmet}} (aylık) hizmet zammı verilir. Toplam çalışma (hizmet) yılına göre artar; hizmet yılı, Profilim’e yazdığın işe giriş tarihinden otomatik hesaplanır. Ücretin %16’sı olan hizmet primi ayrı bir kalemdir (Madde 36). 696 sayılı KHK ile sürekli işçiliğe geçenlerde kıdeme esas başlangıç 02.04.2018’dir.","m":"Madde 58","k":"hizmet zammı hizmet yılı kıdem zammı işe giriş","p":"hizmet","s":"22"},{"i":"n26","c":"ucret","q":"Hizmet primi ile hizmet zammı arasındaki fark nedir?","a":"Hizmet primi (Madde 36): aylık çıplak ücretin %16’sı, günlük ücrete oransal eklenir; çalışma yılına bağlı değildir. Hizmet zammı (Madde 58): kamuda geçen her tam hizmet yılı için sabit aylık tutardır; hizmet yılın arttıkça artar. Şu dönem için hizmet zammı yıl başına brüt {{hizmet}} (aylık).","m":"Madde 36 ve 58","k":"hizmet primi hizmet zammı fark yüzde 16 kıdem zammı","p":"hprim","s":"16"},{"i":"n08","c":"ucret","q":"Ek ödeme (Mayıs ödemesi) nedir?","a":"Müktesep hak sayılmamak ve başka bir ödemeyi etkilememek kaydıyla, yılda bir defa sözleşmenin birinci yılının Mayıs ayında brüt 9.039,08 TL ek ödeme yapılır. İkinci yılın Mayıs ayında, ödendiği döneme kadarki ücret zamları (birinci yılın birinci altı ay zammı olan %24 hariç) oranında artırılarak ödenir. Ödeme yıl içinde çalışılan süre ile orantılıdır.","m":"Madde 57","k":"ek ödeme mayıs ödemesi yıllık ödeme","p":"ekodeme","s":"22"},{"i":"n09","c":"ucret","q":"Gazi, terör mağduru ve şehit yakınlarına ek prim var mı?","a":"Evet. Gazi, terör mağduru ve şehit yakınlarına günlük çıplak ücretin %10’u tutarında ek prim ödenir.","m":"Madde 59","k":"ek prim gazi şehit yakını terör mağduru","s":"23"},{"i":"n10","c":"diger","q":"Deneme süresi ne kadardır?","a":"İşe ilk defa girenler için deneme süresi bir aydır.","m":"Madde 15","k":"deneme süresi işe yeni giriş","s":"6"},{"i":"n11","c":"diger","q":"İller arası yer değişikliği ne zaman istenir?","a":"Kapsama dahil işçilerin iller arası işyeri değiştirme dönemi Haziran ayıdır. İlan ve talepler Mayıs ayında yapılır. İller arası yer değişikliği isteyen işçi, bulunduğu ilde fiilen 2 yıl çalışmadıkça talepte bulunamaz; yıllık izin, hafta tatili ve genel tatil günleri bu süreye fiili çalışma olarak sayılır. Eş, sağlık ve diğer özel haller için dönem ve süre şartı aranmayan düzenlemeler de vardır.","m":"Madde 19","k":"nakil yer değişikliği tayin il değiştirme haziran","s":"6"},{"i":"n12","c":"diger","q":"Mobbing (psikolojik baskı) sözleşmede önleniyor mu?","a":"Evet. Kasıtlı ve sistematik olarak belirli bir süre işçinin aşağılanması, küçümsenmesi, dışlanması, kişiliğinin ve saygınlığının zedelenmesi, kötü muameleye tabi tutulması veya yıldırılması halinde bu ve benzeri fiilleri uygulayanlar hakkında ilgili mevzuat hükümleri uygulanır.","m":"Madde 17","k":"mobbing psikolojik baskı yıldırma dışlama","s":"6"},{"i":"n13","c":"diger","q":"Beyaz kod nedir?","a":"T.C. Sağlık Bakanlığı ve bağlı işyerlerinde, sağlık hizmeti sunumu sırasında veya bu görevlerden dolayı personele karşı işlenen suçlar sebebiyle yürütülen ceza işlemlerinde ve davalarda, personelin talebi üzerine 663 sayılı KHK’nın 54 üncü maddesi hükmü uygulanır (hukukî yardım). Usul ve esasları Bakanlıkça belirlenir.","m":"Madde 17","k":"beyaz kod şiddet hukuki yardım saldırı sağlık çalışanı","s":"6"},{"i":"n14","c":"diger","q":"Sendika üyeliğim nedeniyle ayrımcılığa uğrar mıyım?","a":"Hayır. İşveren, sendikaya üye olan işçilerle üye olmayanlar arasında çalışma şartları veya çalıştırmaya son verilmesi bakımından ayrım yapamaz. Ücret, ikramiye, prim ve paraya ilişkin sosyal yardım konularında toplu iş sözleşmesi hükümleri saklıdır.","m":"Madde 17","k":"sendika üyeliği güvence ayrımcılık","s":"6"},{"i":"n15","c":"disiplin","q":"Disiplin cezaları hafiften ağıra nasıl sıralanır?","a":"Disiplin cezaları hafifinden ağırına doğru şöyledir: ihtar, 1 yevmiye kesme cezası (Y), 2 Y, 3 Y, 4 Y, 5 Y, 6 Y ve işten çıkarma (İ.Ç). Alt ceza uygulamasında bu sıralama dikkate alınır.","m":"Madde 53/A","k":"ceza sıralaması ihtar yevmiye kesme işten çıkarma alt ceza","s":"20"},{"i":"n16","c":"disiplin","q":"Savunma almadan ceza verilebilir mi?","a":"Hayır. Savunması alınarak işçiye disiplin cezası verilmesi esastır. İşçi 7 gün içinde savunmasını verir; verilen süre içinde savunmasını yapmayan işçi savunma hakkından vazgeçmiş sayılır.","m":"Madde 53/A","k":"savunma hakkı savunma süresi 7 gün","s":"20"},{"i":"n17","c":"disiplin","q":"Disiplin cezası verme süresi (zamanaşımı) ne kadardır?","a":"Ceza gerektiren fiilin işlendiğinin öğrenildiği tarihten itibaren 3 ay içinde disiplin soruşturması veya kovuşturması başlamazsa ceza verme yetkisi zamanaşımına uğrar. Fiilin işlendiği tarihten itibaren en geç 2 yıl içinde ceza verilmezse de zamanaşımı dolar.","m":"Madde 53/A","k":"zamanaşımı ceza süresi 3 ay 2 yıl","s":"20"},{"i":"n18","c":"disiplin","q":"Aynı fiili tekrarlarsam ceza artar mı (tekerrür)?","a":"Evet. Belirli bir ceza alan ve cezası kesinleşen işçi, 5 yıl içinde aynı fiil ve hali tekrar işlerse tekerrür hükümleri uygulanarak bir üst ceza verilir. Aynı fiil ve haldan ceza alan işçi 5 yıl içinde aynı fiil ve halden ceza almamışsa tekerrür hükümleri uygulanmaz.","m":"Madde 53/A","k":"tekerrür tekrar ceza 5 yıl bir üst ceza","s":"20"},{"i":"n19","c":"disiplin","q":"İhtar veya yevmiye kesme cezasına nasıl itiraz edilir?","a":"İşçi, ihtar ve yevmiye kesme cezalarına karşı işyeri disiplin kuruluna itiraz edebilir. İtiraz süresi, cezanın işçiye tebliğinden itibaren 7 gündür. Kurul, itiraz dilekçesi ve eklerinin kendisine ulaşmasından itibaren 30 gün içinde kararını verir. Süresinde itiraz edilmeyen veya reddedilen cezalar kesinleşir. Kurul, işçinin çalışma durumunu ve geçmiş hizmetini göz önüne alarak ceza yerine bir alt cezaya hükmedebilir.","m":"Madde 53/B","k":"itiraz disiplin kurulu itiraz süresi 7 gün","s":"21"},{"i":"n20","c":"disiplin","q":"İşten çıkarma cezasını kim verir?","a":"İşten çıkarma cezaları, Bakanlık merkez teşkilatında kurulan Üst Disiplin Kurulu tarafından karara bağlanır; kurulun kararı kesindir. İş Kanunu 25’inci maddesindeki işverenin haklı nedenle derhal fesih yetkisi ayrıca saklıdır.","m":"Madde 53/C","k":"işten çıkarma üst disiplin kurulu kovulma","s":"21"},{"i":"n21","c":"disiplin","q":"İşyeri disiplin kurulu kimlerden oluşur?","a":"İşyerlerinde 3 işveren ve 3 yetkili işçi sendikası temsilcisinden oluşur. Kararlar çoğunlukla alınır; oyların eşitliği halinde başkanın bulunduğu taraf çoğunluğu sağlamış olur. İhtar veya yevmiye kesme cezasını veren disiplin amiri ile işçinin eşi veya ikinci dereceye kadar yakını kurul üyesiyse yerine yedek üye katılır.","m":"Madde 53/B","k":"disiplin kurulu üyeleri kurul","s":"21"},{"i":"n22","c":"ucret","q":"İşbaşı giyim ve ekipman hakkım nedir?","a":"Fiilen çalışılan görevde yürütülen işin gerektirdiği işbaşı giyim ve ekipmanlar, istihkak cetvelinde gösterilen miktar ve sürelerde verilir. Beden ölçüsü alınarak teslim edilir; kıyafetlerde Bakanlığın logosu bulunur. Ayrıca iş ve zaruretleriyle iş sağlığı mevzuatı gereği koruyucu giyim malzemesi verilmeye devam edilir.","m":"Ek-2 İşbaşı Giyim ve Ekipman Esasları","k":"işbaşı giyim kıyafet forma ekipman iş giysisi","s":"27"},{"i":"n23","c":"ucret","q":"Hemşireye yılda hangi iş giysisi verilir?","a":"İstihkak cetveline göre hemşireye 1 yıl mühletle 3 adet hemşire forması ve 2 çift terlik verilir.","m":"Ek-2 İstihkak Cetveli, sıra 1","k":"hemşire forması terlik iş kıyafeti hemşire","s":"28"},{"i":"n24","c":"ucret","q":"Hastabakıcı ve klinik destek elemanına hangi iş giysisi verilir?","a":"Klinik destek elemanı (hastane), yardımcı klinik elemanı (diş), hastabakıcı ve alçı teknisyenine 1 yıl mühletle 3 adet iş forması (üst+alt) ve 2 çift terlik verilir.","m":"Ek-2 İstihkak Cetveli, sıra 17","k":"hastabakıcı klinik destek elemanı iş forması terlik","s":"29"},{"i":"n25","c":"ucret","q":"Temizlik personeline hangi iş giysisi verilir?","a":"Temizlik personeli/görevlisine 1 yıl mühletle 3 adet iş forması (üst+alt), 3 adet tişört, 1 adet polar, 2 çift ayakkabı; 2 yıl mühletle 1 adet yağmurluk (dış mekân) verilir.","m":"Ek-2 İstihkak Cetveli, sıra 12","k":"temizlik personeli iş forması tişört polar ayakkabı yağmurluk","s":"29"},{"i":"n27","c":"izin","q":"Mazeret izni gerektiren olay başka ilde olursa izin uzar mı?","a":"Mazeret izni gerektiren olay, işçinin çalıştığı ilin hudutları dışında vaki olup yolda geçecek süre bir günden fazla olursa, mazeret izniyle birlikte 10 güne kadar izin verilir. Bu süre senelik izinden mahsup edilir.","m":"Madde 30/d","s":"12","k":"mazeret izni yolda geçen süre il dışı vefat yol izni"},{"i":"n28","c":"izin","q":"Evlat edinen işçiye izin var mı?","a":"Üç yaşını doldurmamış çocuğu evlat edinen eşlerden birine veya evlat edinene, çocuğun aileye fiilen teslim edildiği tarihten itibaren sekiz hafta analık hâli izni kullandırılır.","m":"Madde 45/g","s":"18","k":"evlat edinme izni analık hali sekiz hafta evlatlık"},{"i":"n29","c":"ucret","q":"Doğum izninde ikramiye ve giyim yardımım kesilir mi?","a":"Hayır. Doğum nedeniyle ücretli izne ayrılanlara ikramiye, ilave tediye ve giyim yardımları herhangi bir kesinti yapılmaksızın ödenir.","m":"Madde 45/f","s":"18","k":"doğum izni ikramiye giyim yardımı tediye kesinti analık"},{"i":"n30","c":"izin","q":"Doğum (analık) izni nasıl verilir?","a":"4857 sayılı İş Kanunu’nun öngördüğü esaslar dahilinde ücretli izin verilir. Bu süreler doktor raporuyla artırılabilir.","m":"Madde 45/a","s":"18","k":"doğum izni analık izni doğum sonrası izin"},{"i":"n31","c":"mesai","q":"Hamileyken veya emzirirken gece çalıştırılır mıyım?","a":"Kadın çalışanlar, gebe olduklarının sağlık raporuyla tespitinden itibaren doğuma kadar gece çalışmaya zorlanamaz. Yeni doğum yapmış çalışan, doğumu izleyen bir yıl boyunca gece postalarında çalıştırılamaz; sağlık ve güvenlik açısından sakıncalı olduğu raporla belirlenirse bu süre uzar. Emziren kadınlarda bu süre, anne veya çocuğun sağlığı için gerektiği raporla belgelenirse altı ay daha uzatılır.","m":"Madde 21/d ve 45/b","s":"10","k":"gebe emziren gece çalışma hamile gece vardiyası yasak"},{"i":"n32","c":"mesai","q":"Rızam olmadan sürekli gece çalıştırılabilir miyim?","a":"Hayır. İşçinin rızası olmadan 15 günden fazla gece işinde çalıştırılamaz.","m":"Madde 23/b","s":"10","k":"gece işi rıza 15 gün gece vardiyası zorlama"},{"i":"n33","c":"mesai","q":"Postalı (vardiyalı) çalışırken hafta tatili nasıl verilir?","a":"Postalar halinde çalışan işçilere, haftanın herhangi bir gününde, 24 saatten az olmamak üzere (tam gün) ve nöbetleşme yoluyla hafta tatili verilmesi zorunludur. Bu işçilerin hafta tatili, ikili vardiyada 11 saat, üçlü vardiyada 16 saatlik dinlenmeden sonra başlar.","m":"Madde 21/c","s":"10","k":"hafta tatili vardiya posta nöbetleşme dinlenme"},{"i":"n34","c":"diger","q":"İşyerinde giyinme odası zorunlu mu?","a":"Kadın ve erkek işçilerin giysilerini giyinebilmeleri, giysi ve eşyalarını muhafaza edebilmeleri için işveren, imkânlar nispetinde işyerinde müsait bir odayı giyinme odası olarak tahsis eder.","m":"Madde 56","s":"22","k":"giyinme odası soyunma odası dolap"},{"i":"n35","c":"diger","q":"Şikâyet hakkım var mı, nasıl kullanırım?","a":"Her işçinin müracaat veya şikâyet hakkı vardır. İşçi müracaat ve şikâyetini bizzat yapabileceği gibi sendika ve temsilciler aracılığıyla da yapabilir.","m":"Madde 52","s":"20","k":"şikayet hakkı başvuru temsilci sendika dilekçe"},{"i":"n36","c":"diger","q":"Ambulans sürücüsü kazada ne zaman kendi zararından sorumludur?","a":"Ambulanslar ve ambulans sürücüsü ferdi kaza sigortası ile kasko kapsamındadır. Ancak sürücünün aracı alkollü kullanması, uyuşturucu madde almış olması, araca üçüncü kişi alması, aracı şahsi işleri için kullanması, yarışlı ve iddialı sevk etmesi (hizmetin gereği hariç) ya da kasıtlı hareketi veya tam/yüzde yüz kusuru halinde verdiği zararlar sigorta kapsamı dışında kalır ve bu zararlardan sürücü sorumludur.","m":"Madde 51","s":"19","k":"ambulans şoför kaza sigorta kasko sorumluluk zarar"},{"i":"n37","c":"diger","q":"Şoför/ambulans sürücüsünün ehliyetine el konulursa sözleşmesi ne olur?","a":"Şoför veya ambulans sürücüsü olarak görev yapan işçinin istihdamına esas alınan sürücü belgesine el konulması halinde iş sözleşmesi 120 güne kadar hiçbir mali ve özlük hakkı ödenmeksizin askıya alınır. Bu süre bir defaya mahsus 120 gün daha uzatılabilir. Süreler geçtikten sonra sürücü belgesi geri alınamazsa sözleşme işveren tarafından haklı nedenle derhal feshedilir.","m":"Madde 31/9","s":"14","k":"şoför ehliyet el koyma sürücü belgesi askıya iş sözleşmesi"},{"i":"n38","c":"mesai","q":"Yerime gelen olmazsa işi bırakıp çıkabilir miyim?","a":"İşçi, mesaisi sonunda en yakın amirine haber vermek suretiyle işi bırakıp işyerinden ayrılır. İşi kendisinden sonra gelecek olana teslim etmek zorunda olanlar, işi teslim alacaklar gelinceye kadar işbaşında kalmak zorundadır. Bu durumda geçen süre fazla çalışma sayılır.","m":"Madde 16","s":"6","k":"mesai bitiş nöbet teslim vardiya devri işi bırakma fazla çalışma"},{"i":"n39","c":"diger","q":"Görevim dışında işler yaptırılabilir mi?","a":"Hayır. İşçilere mevzuat dışı ve işi ile ilgisi olmayan işler yaptırılamaz.","m":"Madde 18","s":"6","k":"mevzuat dışı iş görev dışı iş yaptırılamaz"},{"i":"n40","c":"disiplin","q":"İhtar ve yevmiye kesme cezasını kim verir?","a":"Ek-1 Disiplin Ceza Cetvelinde yer alan ihtar ve yevmiye kesme cezaları, T.C. Sağlık Bakanlığı Disiplin Amirleri Yönetmeliğinde yetkilendirilen disiplin amirince verilir ve işçiye tebliğ edilir.","m":"Madde 53/A","s":"20","k":"disiplin amiri ceza veren ihtar yevmiye kesme yetkili"},{"i":"n41","c":"disiplin","q":"Aynı fiil için iki ayrı ceza verilir mi?","a":"Hayır. İşlenen fiil veya halin ceza cetvelinde iki ayrı karşılığı olması halinde, aynı fiil için iki ceza verilemeyeceğinden, karşılık gelen cezalardan yalnızca yüksek olanı uygulanır.","m":"Madde 53/A","s":"20","k":"çifte ceza iki ceza aynı fiil yüksek ceza"},{"i":"n42","c":"izin","q":"İşyerim değişirse yol izni verilir mi?","a":"İşverence işin gereği yapılan, belediye hudutları dışındaki il içi daimi işyeri değişikliğinde 2 gün, iller arası değişiklikte 5 güne kadar yol izni verilir. (Büyükşehir belediyelerinde 6245 sayılı Kanun’un ilgili hükmü esas alınır.)","m":"Madde 19/15","s":"8","k":"yol izni nakil tayin işyeri değişikliği"}]};
let AS_C=AS_EMB.cfg,ASD=AS_EMB.q,_asIdx=null,AS_G=AS_EMB.guncelleme||'',AS_REV=AS_EMB.rev;
const AS_KEY='maas_as';
const AS_CATS=['ucret','mesai','izin','disiplin','diger'],AS_CALCS=['gece','mesai','icap','yemek','tatil','izin','tablo'],AS_PERS=['izin','ikramiye','olum','gece','mesai','tatil','hizmet','ekodeme','giyim','hprim'];
const AS_CAT=[{k:'ucret',t:'Ücret ve haklar',ic:'💰',c:'#0f8a5f',cb:'#0f8a5f24'},{k:'mesai',t:'Mesai ve nöbet',ic:'⏱️',c:'#e8710a',cb:'#e8710a24'},{k:'izin',t:'İzin hakları',ic:'🌴',c:'#1976d2',cb:'#1976d224'},{k:'disiplin',t:'Disiplin hükümleri',ic:'⚖️',c:'#7b3fa0',cb:'#7b3fa024'},{k:'diger',t:'Sendika ve diğer hükümler',ic:'🤝',c:'#c2185b',cb:'#c2185b24'}];

/* ---- veri doğrulama (uygulama ve asistan-kontrol.html aynı kuralı kullanır) ---- */
function asValidate(j){const E=[],W=[],isN=x=>typeof x=='number'&&isFinite(x);
 if(!j||typeof j!='object')return{err:['Dosya bir JSON nesnesi değil'],uyari:[]};
 if(j.sema!==1)E.push('sema 1 olmalı');if(!isN(j.rev))E.push('rev (sürüm numarası) sayı olmalı');
 const c=j.cfg;
 if(!c||typeof c!='object')E.push('cfg yok');else{
  if(typeof c.baslik!='string'||!c.baslik)E.push('cfg.baslik yok');if(typeof c.yururluk!='string'||!c.yururluk)E.push('cfg.yururluk yok');
  if(!Array.isArray(c.donem)||c.donem.length!=4||c.donem.some(d=>!Array.isArray(d)||typeof d[0]!='string'||typeof d[1]!='string'))E.push('cfg.donem: 4 adet [ad, tarih aralığı] olmalı');
  if(!Array.isArray(c.donemBas)||c.donemBas.length!=4||c.donemBas.some(d=>!/^\d{4}-\d\d-\d\d$/.test(d)))E.push('cfg.donemBas: 4 adet YYYY-AA-GG olmalı');
  if(!Array.isArray(c.zamYedek)||c.zamYedek.length!=4)E.push('cfg.zamYedek: 4 elemanlı olmalı');
  const K=c.kural||{};['saatBolen','gece','mesaiGunduz','mesaiGece','icapSaat','tatilYevmiye','sgk','damga','izinEsik','izinG1','izinG2','olumGun'].forEach(k=>{if(!isN(K[k]))E.push('cfg.kural.'+k+' sayı olmalı')});
  const T=c.tutar;if(!T||typeof T!='object')E.push('cfg.tutar yok');else Object.keys(T).forEach(k=>{const t=T[k];if(!/^[a-z][a-z0-9]*$/.test(k))E.push('tutar anahtarı geçersiz: '+k);
   if(!t||typeof t.a!='string'||typeof t.u!='string'||typeof t.m!='string'){E.push('tutar.'+k+': a, u, m metin olmalı');return}
   if(!Array.isArray(t.v)||t.v.length!=4||t.v.some(x=>x!==null&&!isN(x)))E.push('tutar.'+k+'.v: 4 elemanlı (sayı veya null) olmalı');else if(!t.yalniz&&!(t.v[0]>0&&t.v[1]>0))E.push('tutar.'+k+': 1. ve 2. dönem tutarı zorunlu')})}
 if(!Array.isArray(j.q)||!j.q.length)E.push('q (soru listesi) boş');else{const ids=new Set(),qs=new Set();j.q.forEach((e,n)=>{const w='#'+(n+1)+' '+((e&&e.i)||'?');if(!e||typeof e!='object'){E.push(w+': kayıt nesne değil');return}
  if(typeof e.i!='string'||!e.i)E.push(w+': i (kimlik) yok');else{if(ids.has(e.i))E.push(w+': kimlik tekrar ediyor');ids.add(e.i)}
  if(AS_CATS.indexOf(e.c)<0)E.push(w+': c geçersiz ('+e.c+')');
  if(typeof e.q!='string'||e.q.length<5)E.push(w+': soru metni yok');else{if(qs.has(e.q))E.push(w+': aynı soru iki kez var');qs.add(e.q)}
  if(typeof e.a!='string'||e.a.length<5)E.push(w+': cevap metni yok');else(e.a.match(/\{\{[^}]*\}\}/g)||[]).forEach(t=>{const k=t.slice(2,-2);if(!(c&&c.tutar&&c.tutar[k]))E.push(w+': bilinmeyen tutar belirteci '+t)});
  if(e.f&&AS_CALCS.indexOf(e.f)<0)E.push(w+': f geçersiz ('+e.f+')');
  if(e.p&&AS_PERS.indexOf(e.p)<0)E.push(w+': p geçersiz ('+e.p+')');
  if(!e.m)W.push(w+': madde numarası yok');if(!e.s)W.push(w+': PDF sayfa numarası yok')})}
 return{err:E,uyari:W}}
function asApply(j){AS_C=j.cfg;ASD=j.q;_asIdx=null;AS_G=j.guncelleme||'';AS_REV=j.rev}
(function(){try{const c=JSON.parse(localStorage.getItem(AS_KEY)||'null');if(c&&c.rev>AS_EMB.rev&&!asValidate(c).err.length)asApply(c)}catch(e){}})();
async function asLoad(){try{const r=await fetch('asistan.json?v='+encodeURIComponent(VER),{cache:'no-cache'});if(!r.ok)return;const j=await r.json();if(j&&j.rev>=AS_EMB.rev&&!asValidate(j).err.length){asApply(j);try{localStorage.setItem(AS_KEY,JSON.stringify(j))}catch(e){}asRender()}}catch(e){}}
const asGet=id=>ASD.find(e=>e.i===id);
const asFind=k=>ASD.find(e=>e.i===k)||ASD.find(e=>e.q.indexOf(k)===0);
const asCatOf=k=>AS_CAT.find(c=>c.k===k)||AS_CAT[4];
const asK=()=>AS_C.kural;
function asDon(){if(ST.asDon>=1&&ST.asDon<=4)return ST.asDon;const t=izToday();let n=1;AS_C.donemBas.forEach((b,i)=>{if(t>=b)n=i+1});return n}
function asZam(n){let z=0;try{z=num(val(ALIAS.B,'BCDE'[n-1]+'37'))}catch(e){}return z>0?z:(AS_C.zamYedek[n-1]||0)}
function asKesin(n){if(n<=2)return true;try{const P=ST.pk&&ST.pk.veri,d=P&&P.donem&&P.donem.find(x=>x.no==n);return !!(d&&d.durum=='kesin'&&d.oran>0)}catch(e){return false}}
function asAmt(k,n){const t=AS_C.tutar[k];if(!t)return null;if(t.v[n-1]>0)return t.v[n-1];if(t.yalniz||n<2)return null;const p=asAmt(k,n-1);if(p==null)return null;const z=asZam(n);return z>0?r2(p*(1+z/100)):null}
function asTahmin(k,n){const t=AS_C.tutar[k];return !(t&&t.v[n-1]>0)&&!asKesin(n)}
function asFmtA(k,n,plain){const v=asAmt(k,n);if(v==null)return plain?'(henüz açıklanmadı)':'<i class=asT>henüz açıklanmadı</i>';const t=fmt(v,'#,##0.00 ₺'),e=asTahmin(k,n);return plain?t+(e?' (tahmini)':''):'<b class=asN>'+t+'</b>'+(e?'<sup class=asT>tahmini</sup>':'')}
function asD6(){try{return num(val(ALIAS.M,'D6'))}catch(e){return 0}}

function asMatch(t,ws){let b=0;for(const w of ws){if(w===t)return 1;if(t.length>=3&&w.startsWith(t))b=Math.max(b,.8);else if(w.length>=4&&t.startsWith(w))b=Math.max(b,.75);else if(t.length>=4&&w.length>=4&&w.slice(0,4)===t.slice(0,4))b=Math.max(b,.55)}return b}
function asSearch(q){const toks=asN(q).split(' ').filter(Boolean);let qt=toks.filter(t=>!AS_STOP.has(t));if(!qt.length)qt=toks;if(!qt.length)return[];const need=Math.max(1,Math.ceil(qt.length*.5)),R=[];
 asIdx().forEach(x=>{let sc=0,hit=0;for(const t of qt){let best=0;for(const alt of [t].concat(AS_SYN[t]||[])){const f=alt===t?1:.85;best=Math.max(best,asMatch(alt,x.q)*5*f,asMatch(alt,x.k)*4*f,asMatch(alt,x.a)*1.5*f)}if(best>0){hit++;sc+=best}}
  if(hit>=need)R.push([x.e,sc*(.5+hit/qt.length)])});
