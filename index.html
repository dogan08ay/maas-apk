function cyrb(t){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}

const TERMS=`<div class=gd>
<h3>1. Amaç</h3>
<p>Bu uygulama, sağlık hizmetlerinde çalışan sürekli işçilerin kendi maaşlarını tahmini olarak hesaplaması ve takip etmesi amacıyla hazırlanmıştır.</p>
<p><b>Bu uygulama herhangi bir kamu kurumuna, bakanlığa veya sendikaya ait değildir.</b> Hesaplamalar kamuya açık Toplu İş Sözleşmesi (TİS) ve mevzuat verilerine göre bilgilendirme amaçlı yapılmaktadır. Sözleşme Asistanı cevapları sözleşmenin özetidir; resmî görüş veya hukuki danışmanlık değildir, sözleşmenin tam metni esastır. Kurum, bakanlık ve sendika adları yalnızca ilgili sözleşmeyi tanımlamak için anılır; herhangi bir bağlantı veya iş birliği ima edilmez.</p>
<h3>2. Resmî belge değildir</h3>
<p>Hesaplamalar bilgilendirme amaçlıdır. Kurumunuzun düzenlediği bordro ve resmî kayıtlar esastır. Yanlış veri girişi, mevzuat veya TİS değişikliği ya da güncelleme sonrası değişen tutarlar nedeniyle oluşabilecek farklardan uygulama sahibi sorumlu tutulamaz. Geriye dönük ve 14 günlük fark sonuçları tahminidir.</p>
<h3>3. Gizlilik</h3>
<p>Girdiğiniz bilgiler yalnızca cihazınızda saklanır; sunucuya gönderilmez, üçüncü kişilerle paylaşılmaz. Uygulama internet bağlantısını yalnızca kendisini, güncellemelerini ve imzalı veri paketini (vergi, TİS ve arşiv verileri) yüklemek için kullanır; kişisel verileriniz gönderilmez.</p>
<p>Şifre özelliği bir ekran kilididir, verileri şifrelemez; unutulan şifre kurtarma koduyla açılır, kod da kaybedilirse veriler yalnızca yedekten geri gelir.</p>
<h3>4. Güncellemeler</h3>
<p>TİS, zam, vergi ve diğer yasal veriler geliştirici tarafından güncellenir. Güncelleme sonrası sonuçlar değişebilir; kullanıcı sonuçları bordrosuyla karşılaştırmakla yükümlüdür.</p>
<h3>5. Kullanım ve dağıtım</h3>
<p>Uygulama yalnızca kişisel kullanım içindir. Amacı dışında kullanılması, izinsiz kopyalanması, çoğaltılması, değiştirilerek veya aynen başkalarına dağıtılması, satılması ya da ticari amaçla kullanılması yasaktır. Tüm hakları saklıdır.</p>
<p class=nt>Güncelleme: Kasım 2026 · Sürüm ${VER}<br>Uygulama sahibi ve geliştiricisi: <b class=dev>Doğan Ay</b></p>
</div>`;

function privacyBody(){return `<div class=gd><h3>Kısaca</h3><p><b>Girdiğiniz bilgiler yalnızca kendi cihazınızda saklanır.</b> Geliştirici bu bilgilere erişemez; bilgileriniz sunucuya gönderilmez, satılmaz ve reklam amacıyla kullanılmaz. Uygulamada hesap açma, üyelik, reklam ve kullanıcı takibi (analiz) yoktur.</p><p>Bu uygulama herhangi bir kamu kurumuna, bakanlığa veya sendikaya ait değildir; kamuya açık TİS ve mevzuat verilerine göre bilgilendirme amaçlı hazırlanmıştır. Asistanda “Hata bildir” veya “Bize sor” düğmesine bastığınızda yalnızca sizin onayınızla e-posta uygulamanız açılır; bildirimdeki soru ve cevap metnini göndermeden önce görür ve değiştirebilirsiniz.</p><h3>1. Bu politika neyi kapsar?</h3><p>Bu politika, <b>Sağlık İşçisi Maaş Hesaplama</b> mobil uygulamasının (kısaca "uygulama") kişisel verilerinizi nasıl işlediğini açıklar. Uygulama, sağlık hizmetlerinde çalışan sürekli işçilerin kendi maaşlarını tahmini olarak hesaplaması ve takip etmesi için hazırlanmıştır. Uygulamanın geliştiricisi <b>Doğan Ay</b>'dır.</p><h3>2. Hangi bilgiler işlenir?</h3><p>Aşağıdaki bilgiler, <b>siz yazdığınız için</b> ve yalnızca cihazınızda işlenir:</p><ul><li><b>Profil bilgileri:</b> ad soyad, unvan, çalıştığınız kurum, işe giriş tarihi, hak edilen yardımlara ilişkin işaretlemeler (engel derecesi, kreş vb.).</li><li><b>Aylık çalışma bilgileri:</b> işe gelme günü, fazla mesai, resmî tatil ve gece çalışması, meslek tazminatı günleri, yol parası, farklı ödeme seçimleri.</li><li><b>Hesaplanan kayıtlar:</b> aylık maaş sonuçları, bordro örnekleri, onayladığınız puantaj kartları, yıllık takip ve izin bilgileri.</li><li><b>Uygulama tercihleri:</b> görünüm, şifre kilidi bilgileri (parolanın kendisi değil, doğrulama özeti), son yedek tarihi.</li></ul><p>Uygulama; konum, kamera, mikrofon, rehber, SMS, fotoğraf galerisi ve benzeri hassas cihaz verilerine erişmez. Kimlik numarası, banka veya kart bilgisi istemez.</p><h3>3. Bilgileriniz nerede tutulur?</h3><p>Tüm bilgiler uygulamanın cihazınızdaki yerel depolama alanında tutulur. <b>Geliştiriciye veya herhangi bir sunucuya gönderilmez.</b> Bu nedenle verilerinizi geliştirici görüntüleyemez, kurtaramaz veya silemez; verileriniz üzerinde kontrol tamamen sizdedir.</p><h3>4. İnternet bağlantısı ne için kullanılır?</h3><p>Uygulama internet bağlantısını yalnızca şu amaçlarla kullanır; bu isteklerde <b>kişisel verileriniz gönderilmez</b>:</p><ul><li><b>Veri paketi:</b> vergi dilimleri, asgari ücret, TİS tutarları ve zam oranlarını içeren imzalı veri paketinin indirilmesi.</li><li><b>Uygulama güncellemesi:</b> uygulama dosyalarının son sürümünün kontrol edilmesi.</li><li><b>Sürüm denetimi:</b> yalnızca Google Play dışından kurulan sürümde, yeni uygulama sürümü olup olmadığının GitHub üzerinden kontrol edilmesi.</li></ul><p>Bu dosyalar GitHub üzerinden sunulur. Herhangi bir internet isteğinde olduğu gibi, barındırma sağlayıcısı IP adresiniz ve cihazınızın teknik bilgilerini kendi gizlilik politikasına göre işleyebilir.</p><h3>5. Üçüncü taraflarla paylaşım</h3><p>Bilgileriniz hiçbir üçüncü tarafla paylaşılmaz, satılmaz veya kiralanmaz. Aşağıdaki durumlar <b>yalnızca sizin başlattığınız</b> işlemlerdir:</p><ul><li><b>Paylaş düğmeleri:</b> "Uygulamayı paylaş" ile WhatsApp, Telegram, Facebook, X, SMS veya e-posta uygulamasına yalnızca uygulamanın tanıtım metni ve indirme bağlantısı gönderilir; maaş veya profil bilgileriniz gönderilmez.</li><li><b>PDF ve yedek paylaşımı:</b> bordro, puantaj PDF'sini veya yedek metnini paylaşırsanız, içerik sizin seçtiğiniz uygulamaya ve kişiye gider. Bu dosyalar kişisel bilgilerinizi içerir; paylaşım kararı ve sorumluluğu size aittir.</li><li><b>Sesli tanıtım:</b> cihazınızın kendi metin okuma özelliğini kullanır; ses kaydı alınmaz.</li></ul><h3>6. Reklam, analiz ve izleme</h3><p>Uygulamada reklam, reklam kimliği, analiz veya izleme yazılımı (SDK), çerez ve davranış takibi <b>bulunmaz</b>. Profil çıkarma veya otomatik karar verme yapılmaz.</p><h3>7. Şifre kilidi ve güvenlik</h3><p>İsteğe bağlı şifre özelliği bir <b>ekran kilididir</b>; verileri şifrelemez. Cihazınızın kendi ekran kilidini ve güncel işletim sistemini kullanmanızı öneririz. Şifrenizi unutursanız kurtarma koduyla açabilirsiniz; kod da kaybedilirse verilere yalnızca aldığınız yedekten ulaşabilirsiniz. Yedek dosyası ve paylaştığınız PDF'ler kişisel bilgilerinizi içerir; güvenli saklayın.</p><h3>8. Verilerin saklanması ve silinmesi</h3><p>Veriler, siz silene kadar cihazınızda kalır. <b>Menü → Verileri sıfırla</b> ile tüm kayıtlarınızı silebilir, ayrıca bir puantajı veya yılı arşivden tek tek silebilirsiniz. Uygulamayı cihazdan kaldırdığınızda yerel verileriniz de silinir. Geliştirici sunucusunda verinizin kopyası bulunmadığı için ayrıca bir silme talebine gerek yoktur.</p><h3>9. Çocukların gizliliği</h3><p>Uygulama çalışan yetişkinlere yöneliktir; 18 yaşın altındaki çocuklara yönelik değildir ve onlardan bilerek veri toplamaz.</p><h3>10. Haklarınız</h3><p>6698 sayılı Kişisel Verilerin Korunması Kanunu (KVKK) madde 11 kapsamındaki haklarınız (bilgi talep etme, düzeltme, silme vb.) saklıdır. Verileriniz yalnızca kendi cihazınızda bulunduğundan bu hakların büyük bölümünü doğrudan uygulama içinden kullanabilirsiniz: bilgileri <b>Profilim</b> ve ilgili ekranlardan düzeltir, <b>Verileri sıfırla</b> ile silersiniz. Başka bir talebiniz varsa aşağıdaki adrese yazabilirsiniz.</p><h3>11. Politikadaki değişiklikler</h3><p>Bu politika güncellenebilir. Önemli değişiklikler uygulama güncellemesiyle ve bu sayfada duyurulur. Güncel metin her zaman uygulamanın <b>Menü → Gizlilik politikası</b> bölümünde bulunur.</p><h3>12. İletişim</h3><p>Geliştirici: <b>Doğan Ay</b><br>E-posta: ${SUPPORT_MAIL?'<a href="mailto:'+SUPPORT_MAIL+'">'+SUPPORT_MAIL+'</a>':'geliştirici ile Play Store sayfasından iletişime geçebilirsiniz'}</p></div>`}

const BEYAN=`<div class=gd>
<h3>Bağımsız uygulama</h3>
<p><b>Bu uygulama herhangi bir kamu kurumuna, bakanlığa veya sendikaya ait değildir.</b> Hiçbir kurum, kuruluş veya sendika tarafından hazırlanmamış, onaylanmamış, yetkilendirilmemiş veya desteklenmemiştir; bunların resmî uygulaması ya da temsilcisi değildir. Hesaplamalar <b>kamuya açık Toplu İş Sözleşmesi (TİS) ve mevzuat verilerine göre bilgilendirme amaçlı</b> yapılmaktadır.</p>
<p>Kurum, bakanlık ve sendika adları ile sözleşme metinleri yalnızca ilgili sözleşmeyi ve yasal dayanağı tanımlamak için anılır. Bu ad, logo ve markalar sahiplerine aittir; herhangi bir bağlantı veya iş birliği ima edilmez.</p>
<h3>Amaç</h3>
<p>Bu uygulama; kendi maaşını hesaplayarak <b>karşılaştırma yapmanıza</b>, eksik veya hatalı durumlarda <b>önceden tedbir almanıza</b> ve aylık maaş hesabının <b>takibini kontrol etmenize</b> yardımcı olmak için hazırlanmış bir hesaplama aracıdır.</p>
<h3>Resmî belge değildir</h3>
<p>Asıl olan, çalıştığınız kurumun düzenlediği <b>maaş bordronuzdur</b>. Uygulamanın sonuçları ve oluşturduğu bordro örnekleri tahminidir; resmî bordro yerine geçmez, itiraz, hak talebi veya hukuki işlemlerde dayanak olarak kullanılamaz.</p>
<h3>Maaşı ne belirler?</h3>
<h4>1. TİS ve yasal veriler</h4>
<p>Başlangıç yevmiyesi, dönem zam oranları, hizmet primi, sosyal yardım, yemek, ikramiye, tediye gibi TİS kazanımları ile asgari ücret ve gelir vergisi dilimleri, uygulama geliştiricisi tarafından hazırlanır ve imzalı veri paketiyle uygulamaya gelir. Siz bu verileri girmezsiniz; yalnızca güncel sürümü kullanırsınız.</p>
<h4>2. Aylık çalışma bilgileri (sizin sorumluluğunuzda)</h4>
<p>İşe gelme gün sayısı, fazla mesai, gece çalışması, resmî tatil çalışması, meslek tazminatı günleri ve benzeri çalışma bilgileri <b>sadece size özeldir</b> ve maaşınızı doğrudan belirler. Bu bilgiler eksik veya hatalı girilirse sonuç da hatalı olur.</p>
<h4>3. Kişisel bilgiler</h4>
<p>İşe giriş tarihi, unvan, engel derecesi, hak edilen yardımlar ve net yol ücreti gibi bilgilerin doğru girilmesi gerekir.</p>
<h3>Güncellemeler ve değişen veriler</h3>
<p>TİS’ler, zam oranları, gelir vergisi dilimleri, asgari ücret ve diğer yasal tutarlar zamanla değişir. Güncelleme sonrası hesaplama sonuçları, kayıtlı bordro ve geriye dönük fark tutarları değişebilir. Güncellenen sürümde sonuçları bordronuzla yeniden karşılaştırmak <b>kullanıcının sorumluluğundadır</b>.</p>
<h3>Geriye dönük ve 14 günlük fark</h3>
<p>Bu ekranlar, kayıtlı maaşlarınız ile yeni TİS tutarlarından <b>tahmini</b> fark üretir. TİS imzalandıktan sonra hesaplanan maaşlarda fark oluşmaz. Bordroda bulunan ancak uygulamada yer almayan kalemler (farklı ödemeler, teknik personel farkı vb.) farka dahil olmayabilir. Gerçek fark, kurumunuzun yapacağı ödeme ve bordroyla belirlenir.</p>
<h3>Vergi yılı</h3>
<p>Aralık maaşı Ocak’ta ödendiği için yeni vergi yılının ilk maaşı sayılır; süregelen matrah Aralık maaşında sıfırlanır. Kurumunuzun uygulaması farklıysa sonuçlar farklı çıkabilir.</p>
<h3>Sorumluluk</h3>
<p>Bilgi ve veri girişlerinin eksik veya yanlış yapılması sonucunda ortaya çıkan hatalı maaş hesabı <b>tamamen kullanıcının kendi sorumluluğundadır</b>. Uygulama ve geliştiricisi, hesaplama sonuçlarından, bu sonuçlara dayanılarak alınan kararlardan veya doğabilecek maddi, manevi ya da hukuki sonuçlardan <b>hiçbir şekilde sorumluluk kabul etmez</b>.</p>
<h3>Bilgilendirme niteliği ve garanti</h3>
<p>Uygulamadaki hesaplamalar ve Sözleşme Asistanı cevapları, toplu iş sözleşmesi ve mevzuatın <b>özetidir</b>; hukuki, mali, vergi veya mesleki danışmanlık değildir. Sözleşmenin tam metni, yürürlükteki mevzuat, kurumunuzun uygulaması ve yetkili makamlar esastır. Bilgiler özenle hazırlanır; ancak doğruluk, eksiksizlik, güncellik veya belirli bir amaca uygunluk <b>garanti edilmez</b>. Yeni protokol, zam, mevzuat veya yorum değişiklikleri nedeniyle hata, eksiklik ya da gecikme olabilir.</p>
<p>Uygulamadaki bilgi ve sonuçlara dayanarak kurumunuza, işverene, sendikaya, yargı veya idari makamlara yapacağınız başvuru, itiraz, talep ve paylaşımlar <b>tamamen sizin sorumluluğunuzdadır</b>. Cevapları veya hesapları paylaşırken bunları resmî görüş ya da kurum açıklaması gibi sunmayınız. Başkalarına ait kişisel veya maaş bilgilerini izinsiz girmeyiniz.</p>
<p>Uygulama ve geliştiricisi, yürürlükteki kanunların izin verdiği ölçüde, uygulamanın kullanımından veya kullanılamamasından doğan doğrudan ya da dolaylı zararlardan sorumlu tutulamaz. Uygulamayı kullanarak bu şartları kabul etmiş sayılırsınız; kabul etmiyorsanız lütfen kullanmayınız.</p>
<h3>Doğru kullanım için</h3>
<ul><li>Uygulamayı güncel tutun ve her güncellemeden sonra sonuçları kontrol edin.</li><li>Her ay çalışma bilgilerinizi eksiksiz girin; puantaj kartını onaylamadan ve maaşı kaydetmeden önce kontrol edin.</li><li>Sonucu mutlaka kendi kurum bordronuzla karşılaştırın; fark varsa kurumunuzun bordro birimine danışın.</li><li>Verileriniz yalnızca telefonunuzda saklanır; yedeğinizi düzenli alın.</li></ul>
<p class=nt>Uygulama sahibi ve geliştiricisi: <b class=dev>Doğan Ay</b></p>
</div>`;
