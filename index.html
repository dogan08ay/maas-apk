const GUIDE=`<div class=gd><h3>1. Uygulama nasıl çalışır?</h3><p>Excel maaş modülünüzün bütün formülleri uygulamanın içinde çalışır. Girdiğiniz her bilgi telefonunuzda saklanır, internet gerekmez. Üstteki yeşil rakam her zaman o ayın net maaşıdır ve siz yazdıkça anında değişir.</p>
<h3>2. İlk kurulum (bir kez yapılır)</h3><ol><li><b>☰ Menü → Profilim:</b> adınızı, teknik personelseniz unvanınızı (Tekniker/Teknisyen), engel dereceniz varsa onu seçin.</li><li><b>Bilgi ve Veri Girişi → Ücret ve zamlar:</b> TİS başlangıç yevmiyesini, dönem adlarını ve zam oranlarını yazın. "Güncel günlük ücret" bordronuzdaki yevmiyeyle aynı olmalı.</li><li><b>Yan haklar:</b> sosyal yardım, hizmet zammı, yemek, İSG, şoför, ek ödeme ve giyimin sözleşme başlangıç tutarlarını, net yolu ve hizmet yılını yazın. Her dönem zammıyla güncel tutar kendiliğinden bulunur.</li><li><b>Vergi:</b> brüt asgari ücreti, vergi dilimlerini ve engelli indirim tutarlarını yılbaşında güncelleyin. İstisna anahtarı açık kalsın.</li></ol>
<h3>3. Her ay maaş hesabı</h3><ol><li><b>Maaş Hesapla → ① Ay:</b> Maaş ayı olarak <b>çalıştığınız ayı</b> seçin. Maaşı bir sonraki ay alırsınız: Şubat'ta alınan maaş Ocak maaşıdır, Ocak seçilir.</li><li><b>Çalışılan gün</b> ve <b>yemek günü</b>nü yazın. Yol yardımı bunlardan ve vergi diliminizden otomatik bulunur.</li><li><b>Süregelen yıllık vergi matrahı:</b> bir önceki ayın bordrosundaki toplam yıllık matrahı yazın. Ocak'ta 0'dır. Maaşı kaydettikten sonra "Toplam matrahı süregelene aktar" derseniz sonraki ay için kendisi taşınır.</li><li><b>② Ek çalışma:</b> fazla mesai saatleri, resmi tatil günü, gece saatlerini girin. Karşılıkları yeşil görünür.</li><li><b>③ Diğer:</b> meslek tazminatı günleri ve 14 günlük fark gibi o aya özel olanları girin.</li><li><b>④ Tediye:</b> tediye maaştan ayrı bir ödemedir. Ödendiği ayda gün sayısını yazın; tediyeyle aynı ay maaşa eklenen ilave vergi istisnası da burada girilir. Maaş ve tediyenin net tutarı ayrı gösterilir.</li><li><b>⑤ Sonuç:</b> kazançlar, kesintiler ve net maaş. Bordronuzla karşılaştırın, sonra "Net maaşı yıllık takibe kaydet" deyin.</li></ol>
<h3>4. Maaşla otomatik gelen ödemeler</h3><table><tr><th>Ödeme</th><th>Maaşa eklendiği ay</th><th>Hesap</th></tr><tr><td>İkramiye</td><td>Mart ve Eylül (Şubat/Ağustos maaşı)</td><td>30 gün × günlük ücret</td></tr><tr><td>Ek ödeme</td><td>Mayıs (Nisan maaşı)</td><td>Bilgi › Yan haklar</td></tr><tr><td>Giyim yardımı</td><td>Eylül (Ağustos maaşı)</td><td>Bilgi › Yan haklar</td></tr><tr><td>Tediye</td><td>Elle: ④ Tediye sekmesinde gün sayısını yazarsınız</td><td>gün × günlük ücret</td></tr></table><p>Bu ayda değilse tutar 0 ₺ görünür, bir şey yapmanız gerekmez.</p>
<h3>5. Vergi dilimi, yol ve vergi istisnası</h3><p>Yol yardımının brütü, ayın sonunda bulunduğunuz vergi dilimine göre otomatik hesaplanır (🟢%15 🟡%20 🟠%27 🔴%35). Aynı simge Sonuç ekranında gelir vergisi satırında da görünür; hangi dilimde olduğunuzu ve sonraki dilime ne kadar kaldığını gösterir. Asgari ücretin vergi istisnası da dilim yükseldikçe artar, aradaki fark net maaşa otomatik eklenir. "Eksik/ilave vergi istisnası" kutusu yalnızca yazdığınız ay için geçerlidir, sonraki aya taşınmaz.</p>
<h3>6. Fark hesapları</h3><p><b>14 Günlük Fark:</b> zam 14 gün geçerliyse eski ve yeni değerleri girin, "Maaş hesabına aktar" deyin. <b>Geriye Dönük Fark:</b> her dönemi ayrı sekmede girin. "Yeni yevmiyeyi tek dokunuşla al" düğmeleri güncel tutarları Bilgiler'den çeker. Son sekme toplam net farkı gösterir.</p>
<h3>7. Yeni zam veya yeni sözleşme gelince</h3><ol><li>Ücret ve zamlar sekmesinde yeni dönem zam oranını yazın, yeni günlük ücret otomatik bulunur.</li><li>İki yılda bir sözleşme yenilenince TİS başlangıç yevmiyesini, TİS öncesi son dönem yevmiyesini, dönem adlarını, zam oranlarını ve yan hak başlangıç tutarlarını yeniden yazın. Sözleşmeye bağlı not metinleri de düzenlenebilir.</li><li>"İlk 6 ay yevmiyesi" = TİS başlangıç yevmiyesi × (1 + 1. dönem zammı). Başlangıç yevmiyesi ve zam değişince kendisi değişir.</li></ol>
<h3>8. Verileriniz</h3><p>Bilgiler yalnızca telefonunuzda durur. Uygulamayı silmeden önce ☰ Menü → <b>Verileri yedekle</b> ile metni kaydedin, yeni kurulumda <b>Yedeği geri yükle</b> ile geri getirin. Uygulama güncellemeleri verilerinizi silmez. ☰ Menü → <b>Şifre</b> ile uygulamaya şifre koyabilirsiniz. Yeni sürüm çıkınca üstte bildirim görünür, <b>Güncelle</b> düğmesine dokunmanız yeterlidir.</p></div>`;

const REPO='dogan08ay/maas-apk',APK_URL='https://github.com/'+REPO+'/releases/latest/download/MaasModulu.apk';
async function nativeBuild(){try{const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;if(!A)return null;const i=await A.getInfo();return +i.build||null}catch(e){return null}}
async function checkApk(){const cur=await nativeBuild();if(!cur)return false;try{const r=await fetch('https://api.github.com/repos/'+REPO+'/releases/latest',{cache:'no-store'}),j=await r.json(),m=String(j.tag_name||'').match(/\d+/);if(m&&+m[0]>cur){const u=document.getElementById('ub2');u.hidden=false;document.getElementById('ub').hidden=true;u.innerHTML='📲 <span>Yeni uygulama sürümü hazır. Mevcut uygulamanın üzerine kurulur, verileriniz silinmez.</span><button class=b style="width:auto;margin:0 0 0 auto;padding:8px 14px" onclick="getApk()">İndir</button>';return true}}catch(e){}return false}
function openApk(){window.open(APK_URL,'_blank')}
function getApk(){modal('Uygulamayı güncelle','<p class=nt><b>Verileriniz silinmez.</b> Yeni sürüm, mevcut uygulamanın üzerine kurulur.</p><ol class=gd><li>Aşağıdaki düğmeyle APK dosyasını indirin.</li><li>İndirme bitince bildirimden ya da Dosyalar uygulamasından APK dosyasına dokunun.</li><li>İstenirse "Bu kaynaktan yüklemeye izin ver" deyin.</li><li><b>Güncelle</b> düğmesine basın.</li></ol><button class=b onclick="openApk()">APK indir</button>')}
async function setLock(pw){const salt=Math.random().toString(36).slice(2)+Date.now();ST.lock={salt,hash:await hp(pw,salt),len:pw.length};save()}
function ovShow(h,c){let o=document.getElementById('ov');if(!o){o=document.createElement('div');document.body.appendChild(o);o.id='ov'}o.className='ov'+(c?' c':'');o.innerHTML='<div style="width:100%;max-width:520px;margin:auto">'+h+'</div>'}
function lockUI(){ovShow(`<div style="text-align:center"><div style="font-size:54px">🔒</div><h2 style="margin:6px 0 2px;display:block">Maaş Modülü</h2><p class=sub>${ST.prof&&ST.prof.ad?'Merhaba, '+esc(ST.prof.ad):'Şifrenizi girin'}</p><input id=lk class=fi type=password inputmode=numeric pattern="[0-9]*" maxlength=8 autocomplete=off placeholder="• • • •" style="text-align:center;font-size:30px;letter-spacing:10px;margin:14px auto;max-width:260px"><div id=lke class="warn a" hidden style="max-width:260px;margin:0 auto 8px"></div><button class=b onclick="lkGo()" style="max-width:260px;margin:6px auto;display:block">Giriş</button><button class="b s" onclick="lkForgot()" style="max-width:260px;margin:8px auto;display:block;background:none;border:0">Şifremi unuttum</button></div>`,1);setTimeout(()=>{const i=document.getElementById('lk');i&&i.focus()},200)}
async function lkGo(){const i=document.getElementById('lk');if(!i||!i.value)return;if(await chkLock(i.value)){unl=true;ovHide();afterUnlock()}else{const e=document.getElementById('lke');e.hidden=false;e.textContent='Şifre yanlış.';i.value='';try{navigator.vibrate&&navigator.vibrate(120)}catch(x){}}}
document.addEventListener('input',e=>{if(e.target.id!=='lk')return;const L=ST.lock&&ST.lock.len;if(L){e.target.value=e.target.value.replace(/\D/g,'');if(e.target.value.length>=L)lkGo()}});
const PWI='type=password inputmode=numeric pattern="[0-9]*" maxlength=8 autocomplete=off';
function lockMenu(){drawer(0);if(!ST.lock)modal('Şifre oluştur',`<p class=nt>Uygulamayı açarken şifre sorulur. Şifre 4-8 rakam olmalıdır. Bu bir ekran kilididir, veriler şifrelenmez.</p><input class=fi id=pw1 ${PWI} placeholder="Yeni şifre (4-8 rakam)"><input class=fi id=pw2 ${PWI} placeholder="Şifre tekrar" style="margin-top:8px"><button class=b onclick="pwSet()">Şifreyi kaydet</button>`);
 else modal('Şifre',`<input class=fi id=pw0 ${PWI} placeholder="Mevcut şifre"><input class=fi id=pw1 ${PWI} placeholder="Yeni şifre (4-8 rakam)" style="margin-top:8px"><input class=fi id=pw2 ${PWI} placeholder="Yeni şifre tekrar" style="margin-top:8px"><button class=b onclick="pwChange()">Şifreyi değiştir</button><button class="b s" onclick="pwRemove()">Şifreyi kaldır</button>`)}
async function pwSet(){const a=$i('pw1');if(!/^\d{4,8}$/.test(a))return toast('Şifre 4-8 rakam olmalı');if(a!==$i('pw2'))return toast('Şifreler aynı değil');await setLock(a);unl=true;mclose();toast('Şifre oluşturuldu')}
async function pwChange(){if(!await chkLock($i('pw0')))return toast('Mevcut şifre yanlış');const a=$i('pw1');if(!/^\d{4,8}$/.test(a))return toast('Yeni şifre 4-8 rakam olmalı');if(a!==$i('pw2'))return toast('Şifreler aynı değil');await setLock(a);mclose();toast('Şifre değiştirildi')}
applyTheme();
build();route();gate();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
