name: APK Olustur
on:
  push:
    branches: [main, master]
    paths: [capacitor.config.json, package.json, icons.py, .github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_B64 }}
      RUN_NO: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Android bulut yedeklemesini kapat (yeniden kurulumda eski veri gelmesin)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$f"
          grep -q 'android:allowBackup="false"' "$f" || sed -i '0,/<application/s//<application android:allowBackup="false"/' "$f"
          grep -n 'allowBackup' "$f"
      - run: pip install pillow && python icons.py
      - name: Imza ve surum numarasi
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > android/maas.p12; fi
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv('RUN_NO') ?: '1')
                  versionName "2." + (System.getenv('RUN_NO') ?: '1')
              }
              if (file('../maas.p12').exists()) {
                  signingConfigs {
                      maas {
                          storeFile file('../maas.p12')
                          storeType 'pkcs12'
                          storePassword 'maasmodulu2026'
                          keyAlias 'maas'
                          keyPassword 'maasmodulu2026'
                      }
                  }
                  buildTypes {
                      debug {
                          signingConfig signingConfigs.maas
                      }
                  }
              }
          }
          GRADLE
      - name: Gradle indirme zaman asimini artir
        run: |
          f=android/gradle/wrapper/gradle-wrapper.properties
          if grep -q '^networkTimeout=' "$f"; then sed -i 's/^networkTimeout=.*/networkTimeout=180000/' "$f"; else echo 'networkTimeout=180000' >> "$f"; fi
          cat "$f"
      - name: APK derle (en fazla 3 deneme)
        run: |
          chmod +x android/gradlew
          cd android
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug; then ok=1; break; fi
            echo "Deneme $i basarisiz, 30 sn sonra tekrar denenecek"; sleep 30
          done
          [ "$ok" = 1 ]
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk MaasModulu.apk
      - name: Surum yayinla
        run: gh release create "v$RUN_NO" MaasModulu.apk --title "Surum $RUN_NO" --notes "Maas Modulu APK" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: MaasModulu-APK
          path: MaasModulu.apk
